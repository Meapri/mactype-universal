name: Windows Build (Rel+Detours x64)

on:
  # PR 이벤트에서만 자동 실행 (중복 방지를 위해 push 트리거 제거)
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  # 필요 시 수동 실행 지원
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg (manifest, x64)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Build (Rel+Detours x64, sequential)
        shell: pwsh
        run: |
          msbuild gdipp.sln /p:Configuration="Rel+Detours" /p:Platform="x64" /p:BuildInParallel=false /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg /p:VcpkgTriplet=x64-windows | cat

      - name: Upload detours.lib artifact (x64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detours-x64
          path: C:\vcpkg\installed\x64-windows\lib\detours.lib


