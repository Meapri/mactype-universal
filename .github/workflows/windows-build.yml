name: Windows Build (Rel+Detours x64)

on:
  # 메인으로 직접 push될 때만 실행
  push:
    branches:
      - main
  # 메인으로의 PR 에서만 실행 (feature 브랜치 push는 실행하지 않음)
  pull_request:
    branches:
      - main

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg (manifest, x64)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Build (Rel+Detours x64, sequential)
        shell: pwsh
        run: |
          msbuild gdipp.sln /p:Configuration="Rel+Detours" /p:Platform="x64" /p:BuildInParallel=false /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg /p:VcpkgTriplet=x64-windows | cat

      - name: Upload detours.lib artifact (x64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detours-x64
          path: C:\vcpkg\installed\x64-windows\lib\detours.lib


