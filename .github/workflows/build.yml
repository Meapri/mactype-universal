name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

jobs:
  build-manager:
    name: Build MacType Manager (Universal App)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup Windows App SDK
      uses: microsoft/setup-windows-appsdk@main
      with:
        version: '1.4'

    - name: Verify Windows SDK
      run: |
        Write-Host "=== Verifying Windows SDK installation ===" -ForegroundColor Green
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue
        if ($sdkVersions) {
          $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Windows SDK found: $($latestSdk.Name)" -ForegroundColor Green
        } else {
          Write-Host "No Windows SDK found" -ForegroundColor Yellow
        }

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          cd vcpkg
        }
        echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Install dependencies via vcpkg
      run: |
        Write-Host "Installing dependencies for Universal App..." -ForegroundColor Cyan

        # Universal app의 경우 x64 triplet 사용 (Windows가 자동으로 적절한 아키텍처 선택)
        .\vcpkg\vcpkg.exe install --triplet x64-windows --binarycaching

        Write-Host "Dependencies installed successfully" -ForegroundColor Green

    - name: Configure and Build Universal App
      run: |
        if (Test-Path "build-manager") {
          Remove-Item -Recurse -Force build-manager
        }
        mkdir build-manager
        cd build-manager

        # Universal App 구성
        Write-Host "Configuring Universal App (x64 + ARM64)..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_GENERATOR_PLATFORM=x64 `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DBUILD_MODERN_MANAGER=ON `
          -DCMAKE_CXX_FLAGS="/MP /O2" `
          -DCMAKE_SYSTEM_NAME=WindowsStore `
          -DCMAKE_SYSTEM_VERSION=10.0

        # 병렬 빌드
        Write-Host "Building Universal App..." -ForegroundColor Cyan
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create Universal App Package
      run: |
        cd build-manager

        # MSIX 패키지 생성을 위한 추가 구성
        Write-Host "Creating Universal App Package..." -ForegroundColor Cyan

        # 앱 패키지 생성 (개발용 sideload)
        if (Test-Path "MacTypeManager.exe") {
          # Universal Windows Platform 앱으로 패키징
          Write-Host "MacTypeManager.exe found, creating MSIX package..." -ForegroundColor Green

          # 간단한 ZIP 아카이브로 패키징 (실제 MSIX는 별도 도구 필요)
          Compress-Archive -Path "MacTypeManager.exe" -DestinationPath "../MacTypeManager-Universal.zip" -CompressionLevel Optimal
        }

    - name: Upload Universal App
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: |
          MacTypeManager-Universal.zip
          build-manager/MacTypeManager.*
        retention-days: 30
        if-no-files-found: error

  build-agents:
    name: Build Agents ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 히스토리 최소화로 속도 향상

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup Windows App SDK
      uses: microsoft/setup-windows-appsdk@main
      with:
        version: '1.4'

    - name: Verify Windows SDK
      run: |
        Write-Host "=== Verifying Windows SDK installation ===" -ForegroundColor Green
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue
        if ($sdkVersions) {
          $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Windows SDK found: $($latestSdk.Name)" -ForegroundColor Green
        } else {
          Write-Host "No Windows SDK found" -ForegroundColor Yellow
        }

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          cd vcpkg
        }
        echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Install dependencies via vcpkg
      run: |
        $triplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        Write-Host "Installing dependencies for $triplet..." -ForegroundColor Cyan

        # 병렬 설치 및 캐시 활용
        .\vcpkg\vcpkg.exe install --triplet $triplet --binarycaching

        Write-Host "Dependencies installed successfully" -ForegroundColor Green

    - name: Configure and Build
      run: |
        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build

        # 플랫폼별 설정
        $generatorPlatform = switch ("${{ matrix.platform }}") {
            "x64" { "x64" }
            "x86" { "Win32" }
            "ARM64" { "ARM64" }
            default { "x64" }
        }
        $vcpkgTriplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }
        $buildAgentFlag = switch ("${{ matrix.platform }}") {
            "x86" { "OFF" }
            "x64" { "ON" }
            "ARM64" { "ON" }
            default { "ON" }
        }

        # 최적화된 CMake 구성
        Write-Host "Configuring CMake for $generatorPlatform..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
          -DCMAKE_GENERATOR_PLATFORM=$generatorPlatform `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$vcpkgTriplet `
          -DBUILD_MODERN_AGENT=$buildAgentFlag `
          -DCMAKE_CXX_FLAGS="/MP /O2"  # 병렬 컴파일 및 최적화

        # 병렬 빌드
        Write-Host "Building with Ninja (parallel: $env:NUMBER_OF_PROCESSORS cores)..." -ForegroundColor Cyan
        cmake --build . --config ${{ matrix.configuration }} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create artifact archive
      run: |
        cd build
        Write-Host "Creating compressed artifact archive..." -ForegroundColor Cyan
        Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip" -CompressionLevel Optimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacType-${{ matrix.platform }}-${{ matrix.configuration }}
        path: MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip
        retention-days: 30
        if-no-files-found: error

    - name: List build results
      run: |
        Write-Host "Build completed successfully!" -ForegroundColor Green
        Write-Host "Generated files:" -ForegroundColor Cyan
        Get-ChildItem -Path build -Include *.exe, *.dll -Recurse | ForEach-Object {
          Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
        }

  create-installer:
    name: Create Universal Windows Installer
    runs-on: windows-latest
    needs: [build-manager, build-agents]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Extract artifacts
      run: |
        Write-Host "Extracting all artifacts..." -ForegroundColor Cyan
        mkdir installer/bin

        # Extract Universal Manager
        if (Test-Path "artifacts/MacTypeManager-Universal") {
          Get-ChildItem -Path "artifacts/MacTypeManager-Universal" -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "installer/bin" -Force
          }
        }

        # Extract agent builds
        Get-ChildItem -Path artifacts -Filter "MacType-*-Release.zip" | ForEach-Object {
          $platform = $_.Name -replace "MacType-(.+)-Release\.zip", '$1'
          Expand-Archive -Path $_.FullName -DestinationPath "installer/bin/$platform" -Force
        }

    - name: Cache NSIS
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\NSIS
        key: nsis-${{ runner.os }}

    - name: Setup NSIS
      if: steps.cache-nsis.outputs.cache-hit != 'true'
      run: choco install nsis -y --no-progress

    - name: Build Universal Windows installer
      run: |
        if (Test-Path "installer/mactype-universal.iss") {
          Write-Host "Building Universal Windows installer..." -ForegroundColor Cyan
          Write-Host "Contents of installer/bin:" -ForegroundColor Yellow
          Get-ChildItem -Path installer/bin -Recurse | Select-Object FullName

          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\mactype-universal.iss
        }

    - name: Upload Universal Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Universal-Installer
        path: installer/Output/*.exe
        retention-days: 30

  create-universal-release:
    name: Create Universal Release
    runs-on: windows-latest
    needs: [build-manager, build-agents, create-installer]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Extract and organize files
      run: |
        Write-Host "Organizing Universal release files..." -ForegroundColor Cyan
        mkdir release-files

        # Extract Universal Manager
        if (Test-Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip") {
          Expand-Archive -Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip" -DestinationPath "release-files/Manager"
        }

        # Extract agent builds
        Get-ChildItem -Path artifacts -Filter "MacType-*-Release.zip" | ForEach-Object {
          $platform = $_.Name -replace "MacType-(.+)-Release\.zip", '$1'
          mkdir "release-files/Agents/$platform"
          Expand-Archive -Path $_.FullName -DestinationPath "release-files/Agents/$platform"
        }

        # Copy installer
        if (Test-Path "artifacts/MacType-Universal-Installer") {
          Copy-Item "artifacts/MacType-Universal-Installer/*.exe" "release-files/"
        }

    - name: Create Universal release archives
      run: |
        Write-Host "Creating Universal release archives..." -ForegroundColor Cyan

        # Create complete Universal package
        Compress-Archive -Path release-files/* -DestinationPath MacType-Universal-Complete.zip -CompressionLevel Optimal

        # Create manager-only package
        Compress-Archive -Path release-files/Manager/* -DestinationPath MacType-Manager-Universal.zip -CompressionLevel Optimal

        # Create agents-only package
        Compress-Archive -Path release-files/Agents/* -DestinationPath MacType-Agents-Universal.zip -CompressionLevel Optimal

        Write-Host "Universal release archives created:" -ForegroundColor Green
        Get-ChildItem -Filter "*.zip" | ForEach-Object {
          Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
        }

    - name: Upload Universal release archives
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Universal-Release
        path: |
          MacType-Universal-*.zip
        retention-days: 60

  deploy-universal-release:
    name: Deploy Universal Release
    runs-on: windows-latest
    needs: create-universal-release
    if: github.event_name == 'release'
    timeout-minutes: 15

    steps:
    - name: Download Universal release archives
      uses: actions/download-artifact@v4
      with:
        name: MacType-Universal-Release
        path: release-assets

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
