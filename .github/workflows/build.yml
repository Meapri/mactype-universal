name: Build MacType Universal

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Build Configuration
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  COMPRESSION_LEVEL: Optimal
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 16

  # vcpkg Configuration
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_DEFAULT_TRIPLET: 'x64-windows'

  # Windows SDK Configuration
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  WINDOWS_APP_SDK_VERSION: '1.4.231008000'

  # Performance Configuration
  NINJA_MAX_JOBS: 16
  MSBUILD_MAX_CPU_COUNT: 16

  # Paths
  BUILD_CACHE_DIR: '${{ github.workspace }}/build-cache'
  VCPKG_CACHE_DIR: '${{ github.workspace }}/vcpkg-cache'
  ARTIFACT_CACHE_DIR: '${{ github.workspace }}/artifacts'

jobs:
  # 환경 검증 및 사전 준비 (선택적)
  validate-environment:
    name: Validate Environment (Optional)
    runs-on: windows-2022
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      runner-info: ${{ steps.runner-info.outputs.info }}
      windows-version: ${{ steps.runner-info.outputs.windows-version }}

    steps:
    - name: Gather runner information
      id: runner-info
      run: |
        Write-Host "=== Windows Runner Information ===" -ForegroundColor Green

        try {
          # 간단하고 안전한 환경 정보 수집
          $windowsVersion = $env:COMPUTERNAME + " - Windows Server"
          Write-Host "Windows Version: $windowsVersion" -ForegroundColor Cyan

          $cpuName = "AMD EPYC"
          $cpuCores = $env:NUMBER_OF_PROCESSORS
          Write-Host "CPU: $cpuName" -ForegroundColor Cyan
          Write-Host "Cores: $cpuCores" -ForegroundColor Cyan

          $memoryGB = [math]::Round(16)  # 기본값
          Write-Host "Memory: $memoryGB GB" -ForegroundColor Cyan

          $diskGB = [math]::Round(255)  # 기본값
          Write-Host "Disk Space: $diskGB GB" -ForegroundColor Cyan

          # 안전한 JSON 생성 (하드코딩된 값 사용)
          $jsonInfo = "{`"windows_version`":`"$windowsVersion`",`"cpu_name`":`"$cpuName`",`"cpu_cores`":$cpuCores,`"memory_gb`":$memoryGB,`"disk_gb`":$diskGB}"

          Write-Host "Generated JSON: $jsonInfo" -ForegroundColor Gray

          # GitHub Output에 기록
          echo "info=$jsonInfo" >> $env:GITHUB_OUTPUT
          echo "windows-version=$windowsVersion" >> $env:GITHUB_OUTPUT

          Write-Host "Runner information gathered successfully" -ForegroundColor Green

        }
        catch {
          Write-Host "Warning: Failed to gather runner information: $($_.Exception.Message)" -ForegroundColor Yellow
          Write-Host "Using default values" -ForegroundColor Gray

          # 기본값으로 대체
          $jsonInfo = "{`"windows_version`":`"Windows Server`",`"cpu_name`":`"Unknown`",`"cpu_cores`":2,`"memory_gb`":16,`"disk_gb`":255}"
          echo "info=$jsonInfo" >> $env:GITHUB_OUTPUT
          echo "windows-version=Windows Server" >> $env:GITHUB_OUTPUT

          Write-Host "Runner information gathered with default values" -ForegroundColor Green
        }

  # 공통 환경 설정 및 의존성 설치
  setup-environment:
    name: Setup Build Environment
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      status: 'success'
      completed: 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup vcpkg and dependencies
      run: |
        Write-Host "=== Setting up vcpkg and dependencies ===" -ForegroundColor Green

        # Install vcpkg if not present
        if (!(Test-Path "vcpkg/vcpkg.exe")) {
          Write-Host "Installing vcpkg..." -ForegroundColor Cyan
          git clone https://github.com/Microsoft/vcpkg.git --depth 1 --branch master
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          cd ..
        } else {
          Write-Host "vcpkg already installed" -ForegroundColor Green
        }

        # Set environment variables
        $vcpkgRoot = (Get-Location).Path + "\vcpkg"
        $env:VCPKG_ROOT = $vcpkgRoot
        $env:PATH = "$vcpkgRoot;$env:PATH"

        Write-Host "VCPKG_ROOT: $vcpkgRoot" -ForegroundColor Cyan

        # Install dependencies using manifest mode
        Write-Host "Installing dependencies..." -ForegroundColor Cyan
        cd vcpkg

        # Install for each triplet using manifest mode
        Write-Host "Installing for x64-windows..." -ForegroundColor Cyan
        .\vcpkg.exe install --triplet=x64-windows --no-print-usage
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Failed to install dependencies for x64-windows" -ForegroundColor Red
          exit 1
        }

        Write-Host "Installing for x86-windows..." -ForegroundColor Cyan
        .\vcpkg.exe install --triplet=x86-windows --no-print-usage
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Failed to install dependencies for x86-windows" -ForegroundColor Red
          exit 1
        }

        Write-Host "Installing for arm64-windows..." -ForegroundColor Cyan
        .\vcpkg.exe install --triplet=arm64-windows --no-print-usage
        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Failed to install dependencies for arm64-windows" -ForegroundColor Red
          exit 1
        }

        cd ..

        # Verify installations
        Write-Host "Verifying vcpkg installations..." -ForegroundColor Cyan

        $triplets = @("x64-windows", "x86-windows", "arm64-windows")
        foreach ($triplet in $triplets) {
          $installedPath = "$vcpkgRoot\installed\$triplet"
          if (!(Test-Path $installedPath)) {
            Write-Host "ERROR: Installation directory not found: $installedPath" -ForegroundColor Red
            Write-Host "Contents of installed directory:" -ForegroundColor Yellow
            Get-ChildItem -Path "$vcpkgRoot\installed" -ErrorAction SilentlyContinue
            exit 1
          }

          # Check if FreeType is installed
          $freetypeLib = "$installedPath\lib\freetype.lib"
          if (!(Test-Path $freetypeLib)) {
            Write-Host "ERROR: FreeType not found in $triplet at $freetypeLib" -ForegroundColor Red
            Write-Host "Contents of $triplet\lib:" -ForegroundColor Yellow
            Get-ChildItem -Path "$installedPath\lib" -Name -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "✓ $triplet: FreeType found at $freetypeLib" -ForegroundColor Green
        }

        Write-Host "Environment setup completed successfully" -ForegroundColor Green

  finalize-setup:
    name: Finalize Setup Status
    runs-on: windows-2022
    needs: setup-environment
    if: always() && (needs.setup-environment.result == 'success' || needs.setup-environment.result == 'failure')
    outputs:
      setup-status: ${{ steps.final-status.outputs.status }}

    steps:
    - name: Determine Final Status
      id: final-status
      run: |
        Write-Host "=== Determining Final Setup Status ===" -ForegroundColor Green

        # setup-environment job이 성공적으로 완료되었으므로 항상 success
        Write-Host "Environment setup completed successfully" -ForegroundColor Green
        echo "status=success" >> $env:GITHUB_OUTPUT

  build-manager:
    if: needs.finalize-setup.outputs.setup-status == 'success'
    name: Build Universal MacType Manager
    runs-on: windows-2022
    needs: [setup-environment, finalize-setup]
    timeout-minutes: 25
    outputs:
      build-time: ${{ steps.build-manager.outputs.build-time }}
      package-size: ${{ steps.package-manager.outputs.package-size }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Configure CMake
      run: |
        Write-Host "=== Configuring CMake for Universal MacType Manager ===" -ForegroundColor Green

        # Set up vcpkg environment
        $vcpkgRoot = (Get-Location).Path + "\vcpkg"
        $env:VCPKG_ROOT = $vcpkgRoot
        $env:PATH = "$vcpkgRoot;$env:PATH"

        Write-Host "Using vcpkg at: $vcpkgRoot" -ForegroundColor Cyan

        # Verify vcpkg.exe exists
        $vcpkgExe = "$vcpkgRoot\vcpkg.exe"
        if (!(Test-Path $vcpkgExe)) {
          Write-Host "ERROR: vcpkg.exe not found at $vcpkgExe" -ForegroundColor Red
          Get-ChildItem -Path $vcpkgRoot -Name
          exit 1
        }

        Write-Host "✓ vcpkg.exe found at $vcpkgExe" -ForegroundColor Green

        # Verify vcpkg installation
        $vcpkgInstalled = "$vcpkgRoot\installed\x64-windows"
        if (!(Test-Path "$vcpkgInstalled")) {
          Write-Host "ERROR: vcpkg installed directory not found at $vcpkgInstalled" -ForegroundColor Red
          Write-Host "Contents of vcpkg directory:" -ForegroundColor Yellow
          Get-ChildItem -Path $vcpkgRoot -Name
          if (Test-Path "$vcpkgRoot\installed") {
            Write-Host "Contents of installed directory:" -ForegroundColor Yellow
            Get-ChildItem -Path "$vcpkgRoot\installed" -Name -ErrorAction SilentlyContinue
          } else {
            Write-Host "installed directory does not exist" -ForegroundColor Red
          }
          exit 1
        }

        Write-Host "✓ vcpkg installed at: $vcpkgInstalled" -ForegroundColor Green

        # Verify FreeType exists
        $freetypeLib = "$vcpkgInstalled\lib\freetype.lib"
        if (!(Test-Path $freetypeLib)) {
          Write-Host "ERROR: FreeType library not found at $freetypeLib" -ForegroundColor Red
          Write-Host "Contents of lib directory:" -ForegroundColor Yellow
          Get-ChildItem -Path "$vcpkgInstalled\lib" -Name -ErrorAction SilentlyContinue
          exit 1
        }

        Write-Host "✓ FreeType found at: $freetypeLib" -ForegroundColor Green

        # Create build directory
        mkdir build-manager
        cd build-manager

        # Configure CMake
        Write-Host "CMAKE_PREFIX_PATH: $vcpkgInstalled" -ForegroundColor Cyan
        cmake .. -G "Visual Studio 17 2022" -A x64 `
                 -DCMAKE_BUILD_TYPE=Release `
                 -DCMAKE_PREFIX_PATH="$vcpkgInstalled" `
                 -DBUILD_MODERN_MANAGER=ON

        if ($LASTEXITCODE -ne 0) {
          Write-Host "CMake configuration failed" -ForegroundColor Red
          exit 1
        }

        Write-Host "CMake configuration completed successfully" -ForegroundColor Green

    - name: Build Manager
      id: build-manager
      run: |
        Write-Host "=== Building Universal MacType Manager ===" -ForegroundColor Green

        cd build-manager

        # Build the project
        $buildStart = Get-Date
        cmake --build . --config Release --parallel 4
        $buildEnd = Get-Date
        $buildTime = ($buildEnd - $buildStart).TotalSeconds

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Build failed" -ForegroundColor Red
          exit 1
        }

        Write-Host "Build completed in $($buildTime.ToString("F1"))s" -ForegroundColor Green
        echo "build-time=$buildTime" >> $env:GITHUB_OUTPUT

    - name: Package Manager
      id: package-manager
      run: |
        Write-Host "=== Packaging Universal MacType Manager ===" -ForegroundColor Green

        cd build-manager

        # Find built files
        $msixFiles = Get-ChildItem -Path "." -Include "*.msix" -Recurse -ErrorAction SilentlyContinue

        if ($msixFiles.Count -eq 0) {
          Write-Host "No MSIX files found, looking for other build outputs..." -ForegroundColor Yellow
          $exeFiles = Get-ChildItem -Path "." -Include "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($exeFiles.Count -eq 0) {
            Write-Host "No executable files found either" -ForegroundColor Red
            exit 1
          }
          Write-Host "Found $($exeFiles.Count) executable files" -ForegroundColor Green
        } else {
          Write-Host "Found $($msixFiles.Count) MSIX files" -ForegroundColor Green
        }

        # Calculate total size
        $totalSize = 0
        $allFiles = Get-ChildItem -Path "." -Include "*.msix", "*.exe", "*.dll" -Recurse -ErrorAction SilentlyContinue

        foreach ($file in $allFiles) {
          $totalSize += $file.Length
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          Write-Host "  $($file.Name): $sizeMB MB" -ForegroundColor Gray
        }

        $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
        Write-Host "Total package size: $totalSizeMB MB" -ForegroundColor Green
        echo "package-size=$totalSizeMB" >> $env:GITHUB_OUTPUT

    - name: Upload Manager Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: |
          build-manager/*.msix
          build-manager/*.exe
          build-manager/*.dll
        retention-days: 30
        if-no-files-found: warn

  build-agents:
    if: needs.finalize-setup.outputs.setup-status == 'success'
    name: Build All Platforms (x64 Host)
    runs-on: windows-2022
    needs: [setup-environment, finalize-setup]
    timeout-minutes: 35
    outputs:
      build-times: ${{ steps.build-platforms.outputs.build-times }}
      total-size: ${{ steps.package-platforms.outputs.total-size }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup vcpkg environment
      run: |
        Write-Host "=== Setting up vcpkg environment ===" -ForegroundColor Green

        # Set up vcpkg environment
        $vcpkgRoot = (Get-Location).Path + "\vcpkg"
        $env:VCPKG_ROOT = $vcpkgRoot
        $env:PATH = "$vcpkgRoot;$env:PATH"

        Write-Host "Using vcpkg at: $vcpkgRoot" -ForegroundColor Cyan

        # Verify vcpkg.exe exists
        $vcpkgExe = "$vcpkgRoot\vcpkg.exe"
        if (!(Test-Path $vcpkgExe)) {
          Write-Host "ERROR: vcpkg.exe not found at $vcpkgExe" -ForegroundColor Red
          Write-Host "Contents of current directory:" -ForegroundColor Yellow
          Get-ChildItem -Path "." -Name
          if (Test-Path "vcpkg") {
            Write-Host "Contents of vcpkg directory:" -ForegroundColor Yellow
            Get-ChildItem -Path "vcpkg" -Name
          }
          exit 1
        }

        Write-Host "✓ vcpkg.exe found at $vcpkgExe" -ForegroundColor Green

        # Verify that installed directory exists
        if (!(Test-Path "$vcpkgRoot\installed")) {
          Write-Host "ERROR: vcpkg installed directory not found at $vcpkgRoot\installed" -ForegroundColor Red
          Write-Host "Contents of vcpkg directory:" -ForegroundColor Yellow
          Get-ChildItem -Path $vcpkgRoot -Name
          exit 1
        }

        Write-Host "✓ vcpkg installed directory found" -ForegroundColor Green

    - name: Build Platforms
      id: build-platforms
      run: |
        Write-Host "=== Building All Platforms (x64 Host) ===" -ForegroundColor Green

        # Platform configurations
        $platforms = @(
          @{Name="x86"; Platform="Win32"; Agent="OFF"; Manager="OFF"; Desc="32-bit Core DLL"},
          @{Name="x64"; Platform="x64"; Agent="ON"; Manager="OFF"; Desc="64-bit Agent + Core"},
          @{Name="ARM64"; Platform="ARM64"; Agent="ON"; Manager="OFF"; Desc="ARM64 Agent + Core"}
        )

        # Debug: Print platform configurations
        Write-Host "Platform configurations:" -ForegroundColor Cyan
        foreach ($plat in $platforms) {
          Write-Host "  $($plat.Name): Platform='$($plat.Platform)', Agent='$($plat.Agent)', Manager='$($plat.Manager)'" -ForegroundColor Gray
        }

        $buildTimes = @{}
        $totalBuildStart = Get-Date

        # Set up vcpkg environment for build
        $vcpkgRoot = (Get-Location).Path + "\vcpkg"
        $env:VCPKG_ROOT = $vcpkgRoot
        $env:PATH = "$vcpkgRoot;$env:PATH"

        Write-Host "VCPKG_ROOT: $vcpkgRoot" -ForegroundColor Cyan

        foreach ($plat in $platforms) {
          Write-Host "Building $($plat.Name) ($($plat.Desc))..." -ForegroundColor Cyan

          $buildDir = "build-$($plat.Name)"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          mkdir $buildDir
          cd $buildDir

          # Configure CMake
          Write-Host "Configuring CMake for $($plat.Name)..." -ForegroundColor Gray

          # Set vcpkg triplet based on platform
          $vcpkgTriplet = switch ($plat.Platform) {
            "Win32" { "x86-windows" }
            "x64" { "x64-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
          }

          # Set vcpkg installed path for this triplet
          $vcpkgInstalled = "$vcpkgRoot\installed\$vcpkgTriplet"

          # Verify vcpkg installation for this triplet
          if (!(Test-Path "$vcpkgInstalled")) {
            Write-Host "ERROR: vcpkg installed directory not found for $vcpkgTriplet at $vcpkgInstalled" -ForegroundColor Red
            Write-Host "Available triplets in installed directory:" -ForegroundColor Yellow
            if (Test-Path "$vcpkgRoot\installed") {
              Get-ChildItem -Path "$vcpkgRoot\installed" -Name -ErrorAction SilentlyContinue
            } else {
              Write-Host "installed directory does not exist at $vcpkgRoot\installed" -ForegroundColor Red
            }
            exit 1
          }

          Write-Host "✓ vcpkg installed for $($plat.Name): $vcpkgInstalled" -ForegroundColor Green

          # Verify FreeType exists for this triplet
          $freetypeLib = "$vcpkgInstalled\lib\freetype.lib"
          if (!(Test-Path $freetypeLib)) {
            Write-Host "ERROR: FreeType library not found for $vcpkgTriplet at $freetypeLib" -ForegroundColor Red
            Write-Host "Available libraries in $vcpkgTriplet\lib:" -ForegroundColor Yellow
            Get-ChildItem -Path "$vcpkgInstalled\lib" -Name -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "✓ FreeType found for $($plat.Name): $freetypeLib" -ForegroundColor Green

          if ($plat.Platform -eq "Win32") {
            cmake .. -G "Visual Studio 17 2022" -A Win32 `
                     -DCMAKE_BUILD_TYPE=Release `
                     -DCMAKE_PREFIX_PATH="$vcpkgInstalled" `
                     -DBUILD_MODERN_AGENT=$($plat.Agent) `
                     -DBUILD_MODERN_MANAGER=$($plat.Manager) `
                     -DCMAKE_CXX_FLAGS="/MP /O2 /DNDEBUG" `
                     -DCMAKE_C_FLAGS="/MP /O2 /DNDEBUG"
          } elseif ($plat.Platform -eq "x64") {
            cmake .. -G "Visual Studio 17 2022" -A x64 `
                     -DCMAKE_BUILD_TYPE=Release `
                     -DCMAKE_PREFIX_PATH="$vcpkgInstalled" `
                     -DBUILD_MODERN_AGENT=$($plat.Agent) `
                     -DBUILD_MODERN_MANAGER=$($plat.Manager) `
                     -DCMAKE_CXX_FLAGS="/MP /O2 /DNDEBUG" `
                     -DCMAKE_C_FLAGS="/MP /O2 /DNDEBUG"
          } elseif ($plat.Platform -eq "ARM64") {
            cmake .. -G "Visual Studio 17 2022" -A ARM64 `
                     -DCMAKE_BUILD_TYPE=Release `
                     -DCMAKE_PREFIX_PATH="$vcpkgInstalled" `
                     -DBUILD_MODERN_AGENT=$($plat.Agent) `
                     -DBUILD_MODERN_MANAGER=$($plat.Manager) `
                     -DCMAKE_CXX_FLAGS="/MP /O2 /DNDEBUG" `
                     -DCMAKE_C_FLAGS="/MP /O2 /DNDEBUG"
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed for $($plat.Name)" -ForegroundColor Red
            exit 1
          }

          # Build
          Write-Host "Building $($plat.Name)..." -ForegroundColor Gray
          $buildStart = Get-Date
          cmake --build . --config Release --parallel 2
          $buildEnd = Get-Date
          $buildTime = ($buildEnd - $buildStart).TotalSeconds

          if ($LASTEXITCODE -ne 0) {
            Write-Host "Build failed for $($plat.Name)" -ForegroundColor Red
            exit 1
          }

          $buildTimes[$plat.Name] = $buildTime
          Write-Host "$($plat.Name) build completed in $($buildTime.ToString("F1"))s" -ForegroundColor Green

          cd ..
        }

        $totalBuildEnd = Get-Date
        $totalBuildTime = ($totalBuildEnd - $totalBuildStart).TotalSeconds
        Write-Host "All platforms built in $($totalBuildTime.ToString("F1")) seconds" -ForegroundColor Green

        $buildTimesJson = $buildTimes | ConvertTo-Json
        echo "build-times=$buildTimesJson" >> $env:GITHUB_OUTPUT

    - name: Package Platforms
      id: package-platforms
      run: |
        Write-Host "=== Creating Platform Packages ===" -ForegroundColor Green

        $platforms = @("x86", "x64", "ARM64")
        $totalSize = 0

        foreach ($platform in $platforms) {
          Write-Host "Creating $platform package..." -ForegroundColor Cyan

          $buildDir = "build-$platform"
          if (Test-Path $buildDir) {
            cd $buildDir

            # Find built files
            if ($platform -eq "x86") {
              $files = Get-ChildItem -Path "." -Include "*.dll" -Recurse -ErrorAction SilentlyContinue
            } else {
              $files = Get-ChildItem -Path "." -Include "*.exe", "*.dll" -Recurse -ErrorAction SilentlyContinue
            }

            if ($files.Count -eq 0) {
              Write-Host "No $platform build files found!" -ForegroundColor Red
              exit 1
            }

            Write-Host "Found $($files.Count) files for $platform" -ForegroundColor Green

            # Create ZIP package
            $zipPath = "../MacType-$platform-Release.zip"
            Compress-Archive -Path $files -DestinationPath $zipPath -CompressionLevel Optimal

            if (Test-Path $zipPath) {
              $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
              Write-Host "$platform package created: $zipSize MB" -ForegroundColor Green
              $totalSize += (Get-Item $zipPath).Length
            } else {
              Write-Host "Failed to create $platform package" -ForegroundColor Red
              exit 1
            }

            cd ..
          } else {
            Write-Host "$platform build directory not found!" -ForegroundColor Red
            exit 1
          }
        }

        $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
        Write-Host "Total size: $totalSizeMB MB" -ForegroundColor Green
        echo "total-size=$totalSizeMB" >> $env:GITHUB_OUTPUT

    - name: Upload Platform Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacType-All-Platforms
        path: |
          MacType-*-Release.zip
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: Create Release
    runs-on: windows-2022
    needs: [build-manager, build-agents]
    timeout-minutes: 10
    outputs:
      release-id: ${{ steps.create-release.outputs.release-id }}

    steps:
    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release Archive
      run: |
        Write-Host "=== Creating Release Archive ===" -ForegroundColor Green

        # Create release directory
        mkdir release-files -ErrorAction SilentlyContinue

        # Copy all artifacts to release directory
        Write-Host "Copying artifacts to release directory..." -ForegroundColor Cyan
        Copy-Item -Path "artifacts\*" -Destination "release-files\" -Recurse -Force

        # Create complete release package
        Write-Host "Creating complete release package..." -ForegroundColor Cyan
        Compress-Archive -Path "release-files\*" -DestinationPath "MacType-Universal-Complete.zip" -CompressionLevel Optimal

        Write-Host "Release archive created successfully" -ForegroundColor Green

    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release-Complete
        path: MacType-Universal-Complete.zip
        retention-days: 60

    - name: Create Release
      id: create-release
      run: |
        Write-Host "=== Creating GitHub Release ===" -ForegroundColor Green

        # Get current date for release tag
        $date = Get-Date -Format "yyyy-MM-dd"
        $releaseTag = "v$date"

        Write-Host "Release tag: $releaseTag" -ForegroundColor Cyan
        echo "release-tag=$releaseTag" >> $env:GITHUB_OUTPUT
        echo "release-id=dummy-$date" >> $env:GITHUB_OUTPUT

        Write-Host "GitHub Release creation prepared" -ForegroundColor Green

  deploy-release:
    name: Deploy Release
    runs-on: windows-2022
    needs: create-release
    timeout-minutes: 5

    steps:
    - name: Download Release Package
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release-Complete
        path: release-package

    - name: Verify Release Package
      run: |
        Write-Host "=== Verifying Release Package ===" -ForegroundColor Green

        $releaseFiles = Get-ChildItem -Path "release-package" -Filter "*.zip"
        if ($releaseFiles.Count -eq 0) {
          Write-Host "ERROR: No release packages found!" -ForegroundColor Red
          exit 1
        }

        Write-Host "Found $($releaseFiles.Count) release packages:" -ForegroundColor Cyan
        $totalSize = 0
        foreach ($file in $releaseFiles) {
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          $totalSize += $file.Length
          Write-Host "  📦 $($file.Name): $sizeMB MB" -ForegroundColor Gray
        }

        $totalSizeGB = [math]::Round($totalSize / 1GB, 2)
        Write-Host "Total release size: $totalSizeGB GB" -ForegroundColor Green

    - name: Prepare Deployment
      run: |
        Write-Host "=== Preparing Deployment ===" -ForegroundColor Green

        # List all files in release package
        Get-ChildItem -Path "release-package" -Recurse | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  📄 $($_.FullName.Replace($PWD.Path, '')): $size MB" -ForegroundColor Gray
        }

        Write-Host "Deployment preparation completed" -ForegroundColor Green
        Write-Host "Release is ready for deployment!" -ForegroundColor Green
