name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  BUILD_TYPE: Release
  COMPRESSION_LEVEL: Optimal
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 16

jobs:
  # 공통 환경 설정 및 의존성 설치
  setup-environment:
    name: Setup Environment
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      vcpkg-root: ${{ steps.setup-vcpkg.outputs.vcpkg-root }}
      setup-time: ${{ steps.setup-complete.outputs.setup-time }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup Windows Development Environment
      run: |
        Write-Host "=== Setting up Windows Development Environment ===" -ForegroundColor Green

        # Function to check and install Windows App SDK
        function Install-WindowsAppSDK {
          param([string]$SdkUrl)

          $installerPath = "$env:TEMP\WindowsAppRuntimeInstall.exe"

          try {
            Write-Host "Downloading Windows App Runtime..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri $SdkUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 300

            Write-Host "Installing Windows App Runtime..." -ForegroundColor Cyan
            $installProcess = Start-Process -FilePath $installerPath -ArgumentList "/silent", "/norestart" -Wait -NoNewWindow -PassThru

            if ($installProcess.ExitCode -eq 0) {
              Write-Host "Windows App SDK installed successfully" -ForegroundColor Green
              return $true
            } else {
              Write-Host "Windows App SDK installation failed with exit code: $($installProcess.ExitCode)" -ForegroundColor Red
              return $false
            }
          }
          catch {
            Write-Host "Windows App SDK installation error: $($_.Exception.Message)" -ForegroundColor Red
            return $false
          }
          finally {
            if (Test-Path $installerPath) {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
            }
          }
        }

        # Check Windows SDK and install Windows App SDK if needed
        $sdkFound = $false
        $sdkPaths = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe",
          "${env:ProgramFiles}\Microsoft SDKs\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe",
          "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe"
        )

        foreach ($path in $sdkPaths) {
          if (Test-Path $path) {
            Write-Host "Windows SDK found: $path" -ForegroundColor Green
            $sdkFound = $true
            break
          }
        }

        if (-not $sdkFound) {
          Write-Host "Windows SDK not found, installing Windows App Runtime..." -ForegroundColor Yellow
          $sdkUrl = "https://aka.ms/windowsappsdk/1.4/latest/windowsappruntimeinstall-x64.exe"
          $installSuccess = Install-WindowsAppSDK -SdkUrl $sdkUrl

          if (-not $installSuccess) {
            Write-Host "Warning: Windows App SDK installation failed, but continuing build..." -ForegroundColor Yellow
          }
        } else {
          Write-Host "Windows development environment is ready" -ForegroundColor Green
        }

    - name: Verify Windows Environment
      run: |
        Write-Host "=== Windows Environment Verification ===" -ForegroundColor Green
        Write-Host "Available CPU cores: $env:NUMBER_OF_PROCESSORS" -ForegroundColor Cyan

        # Windows SDK 버전 확인
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue
        if ($sdkVersions) {
          $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Windows SDK: $($latestSdk.Name)" -ForegroundColor Green
        } else {
          Write-Host "Windows SDK: Not found" -ForegroundColor Yellow
        }

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      id: setup-vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          Write-Host "Cloning vcpkg..." -ForegroundColor Cyan
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          Write-Host "Using cached vcpkg..." -ForegroundColor Cyan
          cd vcpkg
        }
        $vcpkgRoot = $PWD
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH
        echo "vcpkg-root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
        cd ..
        Write-Host "vcpkg ready at: $vcpkgRoot" -ForegroundColor Green

    - name: Optimize vcpkg for performance
      run: |
        Write-Host "=== Optimizing vcpkg for performance ===" -ForegroundColor Green

        # Configure vcpkg for better performance
        Write-Host "Configuring vcpkg settings..." -ForegroundColor Cyan
        $vcpkgRoot = $PWD
        cd vcpkg

        # Enable binary caching and parallel downloads
        .\vcpkg.exe integrate install --dry-run | Out-Null

        # Pre-download common packages to reduce build time
        Write-Host "Pre-downloading common dependencies..." -ForegroundColor Cyan
        .\vcpkg.exe install --triplet x64-windows --only-downloads --binarycaching

        cd $vcpkgRoot
        Write-Host "vcpkg optimization complete" -ForegroundColor Green

    - name: Complete setup
      id: setup-complete
      run: |
        $setupTime = (Get-Date).ToString("o")
        echo "setup-time=$setupTime" >> $env:GITHUB_OUTPUT
        Write-Host "Environment setup completed at $setupTime" -ForegroundColor Green

  # Universal Manager 빌드 (x64 + ARM64 지원)
  build-manager:
    name: Build Universal MacType Manager
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        echo "VCPKG_ROOT=${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_ENV
        echo "${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_PATH

    - name: Configure and Build Universal Manager
      run: |
        Write-Host "=== Building Universal MacType Manager ===" -ForegroundColor Green

        if (Test-Path "build-manager") {
          Remove-Item -Recurse -Force build-manager
        }
        mkdir build-manager
        cd build-manager

        # Universal Windows App 구성 (Visual Studio generator 사용)
        Write-Host "Configuring Universal Windows App (x64 + ARM64)..." -ForegroundColor Cyan

        # Ninja 대신 Visual Studio generator 사용 (platform 지원)
        $cmakeArgs = @(
            "..",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DBUILD_MODERN_MANAGER=ON",
            "-DCMAKE_SYSTEM_NAME=WindowsStore",
            "-DCMAKE_SYSTEM_VERSION=10.0"
        )

        & cmake @cmakeArgs

        # Universal Windows Platform 앱 빌드
        Write-Host "Building Universal MacType Manager (x64 + ARM64)..." -ForegroundColor Cyan
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS --target MacTypeManager

        # 빌드 결과 확인
        Write-Host "Universal Manager build completed. Checking artifacts..." -ForegroundColor Cyan
        Get-ChildItem -Path "." -Include "*.exe", "*.dll", "*.msix", "*.appx" -Recurse | ForEach-Object {
          Write-Host "  📦 $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" -ForegroundColor Green
        }

    - name: Create Universal Manager Package
      run: |
        Write-Host "Creating Universal Manager package..." -ForegroundColor Cyan
        cd build-manager

        # 실행 파일 확인 및 패키징
        $exeFiles = Get-ChildItem -Path "." -Filter "*.exe" -Recurse
        if ($exeFiles.Count -gt 0) {
          Write-Host "Found executable files:" -ForegroundColor Green
          $exeFiles | ForEach-Object {
            Write-Host "  $($_.FullName)" -ForegroundColor Gray
          }

          # ZIP 패키지 생성
          Compress-Archive -Path "*.exe", "*.dll", "*.pri", "*.appx" -DestinationPath "../MacTypeManager-Universal.zip" -CompressionLevel Optimal
          Write-Host "Universal Manager package created" -ForegroundColor Green
        } else {
          Write-Host "No executable files found!" -ForegroundColor Red
          exit 1
        }

    - name: Upload Universal Manager
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: |
          MacTypeManager-Universal.zip
          build-manager/*.exe
          build-manager/*.dll
        retention-days: 30
        if-no-files-found: error

  # 플랫폼별 에이전트 + 코어 빌드 (x64 호스트에서 크로스 컴파일)
  build-agents:
    name: Build All Platforms (x64 Host)
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 35

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
        if (Test-Path $vcpkgRoot) {
            echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
            echo "$vcpkgRoot" >> $env:GITHUB_PATH
            Write-Host "vcpkg root restored: $vcpkgRoot" -ForegroundColor Green
        } else {
            Write-Host "vcpkg root not found: $vcpkgRoot" -ForegroundColor Red
            exit 1
        }

    - name: Install multi-platform dependencies
      run: |
        Write-Host "=== Installing Multi-Platform Dependencies ===" -ForegroundColor Green

        # 모든 플랫폼의 의존성을 한 번에 설치
        $platforms = @("x86-windows", "x64-windows", "arm64-windows")

        foreach ($triplet in $platforms) {
          Write-Host "Installing dependencies for $triplet..." -ForegroundColor Cyan

          $installArgs = @(
              "install",
              "--triplet", $triplet,
              "--binarycaching",
              "--downloads-root", "$PWD\vcpkg-downloads",
              "--x-buildtrees-root", "$PWD\vcpkg-buildtrees",
              "--x-install-root", "$PWD\vcpkg-installed",
              "--x-packages-root", "$PWD\vcpkg-packages"
          )

          $vcpkgPath = ".\vcpkg\vcpkg.exe"
          if (Test-Path $vcpkgPath) {
              & $vcpkgPath @installArgs
              Write-Host "Dependencies for $triplet installed successfully" -ForegroundColor Green
          } else {
              Write-Host "vcpkg.exe not found" -ForegroundColor Red
              exit 1
          }
        }

        Write-Host "All platform dependencies ready" -ForegroundColor Green

    - name: Build All Platforms
      run: |
        Write-Host "=== Building All Platforms (x64 Host) ===" -ForegroundColor Green

        # 플랫폼별 빌드 설정
        $platforms = @(
          @{Name="x86"; Platform="Win32"; Triplet="x86-windows"; Agent="OFF"; Manager="OFF"; Desc="32-bit Core DLL"},
          @{Name="x64"; Platform="x64"; Triplet="x64-windows"; Agent="ON"; Manager="OFF"; Desc="64-bit Agent + Core"},
          @{Name="ARM64"; Platform="ARM64"; Triplet="arm64-windows"; Agent="ON"; Manager="OFF"; Desc="ARM64 Agent + Core"}
        )

        $totalBuildStart = Get-Date

        foreach ($plat in $platforms) {
          Write-Host "Building $($plat.Name) ($($plat.Desc))..." -ForegroundColor Cyan

          $buildDir = "build-$($plat.Name)"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          mkdir $buildDir
          cd $buildDir

          # 플랫폼별 CMake 구성
          $cmakeArgs = @(
              "..",
              "-G", $env:CMAKE_GENERATOR,
              "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE",
              "-DCMAKE_GENERATOR_PLATFORM=$($plat.Platform)",
              "-DCMAKE_TOOLCHAIN_FILE=$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake",
              "-DVCPKG_TARGET_TRIPLET=$($plat.Triplet)",
              "-DBUILD_MODERN_AGENT=$($plat.Agent)",
              "-DBUILD_MODERN_MANAGER=$($plat.Manager)",
              "-DCMAKE_CXX_FLAGS=/MP /O2 /DNDEBUG",
              "-DCMAKE_EXE_LINKER_FLAGS=/OPT:REF /OPT:ICF",
              "-DCMAKE_SHARED_LINKER_FLAGS=/OPT:REF /OPT:ICF",
              "-DCMAKE_C_FLAGS=/MP /O2 /DNDEBUG"
          )

          & cmake @cmakeArgs

          # 병렬 빌드
          $parallelJobs = [math]::Min([int]$env:CMAKE_BUILD_PARALLEL_LEVEL, [int]$env:NUMBER_OF_PROCESSORS + 2)
          Write-Host "Building with $parallelJobs parallel jobs..." -ForegroundColor Gray

          $buildStart = Get-Date
          cmake --build . --config $env:BUILD_TYPE --parallel $parallelJobs --verbose
          $buildEnd = Get-Date
          $buildTime = ($buildEnd - $buildStart).TotalSeconds

          Write-Host "$($plat.Name) build completed in $($buildTime.ToString("F1"))s" -ForegroundColor Green

          cd ..
        }

        $totalBuildEnd = Get-Date
        $totalBuildTime = ($totalBuildEnd - $totalBuildStart).TotalSeconds
        Write-Host "All platforms built in $($totalBuildTime.ToString("F1")) seconds" -ForegroundColor Green

    - name: Create Platform Packages
      run: |
        Write-Host "=== Creating Platform Packages ===" -ForegroundColor Green

        $platforms = @("x86", "x64", "ARM64")

        foreach ($platform in $platforms) {
          Write-Host "Creating $platform package..." -ForegroundColor Cyan

          $buildDir = "build-$platform"
          if (Test-Path $buildDir) {
            cd $buildDir

            # 파일 수집
            if ($platform -eq "x86") {
              $files = Get-ChildItem -Path "." -Include "*.dll" -Recurse
              $expectedAgent = "MacType.Core.dll"
            } else {
              $files = Get-ChildItem -Path "." -Include "*.exe", "*.dll" -Recurse
              $expectedAgent = "mt64agnt-$platform.exe"
            }

            if ($files.Count -gt 0) {
              # 에이전트 파일 검증 (x86 제외)
              if ($platform -ne "x86") {
                $agentFile = $files | Where-Object { $_.Name -eq $expectedAgent }
                if (-not $agentFile) {
                  Write-Host "Warning: Expected agent file '$expectedAgent' not found" -ForegroundColor Yellow
                } else {
                  Write-Host "Found expected agent: $expectedAgent" -ForegroundColor Green
                }
              }

              # 파일 정보 출력
              $totalSize = 0
              $files | Sort-Object Length -Descending | ForEach-Object {
                $sizeKB = [math]::Round($_.Length / 1KB, 2)
                $totalSize += $_.Length
                Write-Host "  $($_.Name) ($sizeKB KB)" -ForegroundColor Gray
              }

              $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
              Write-Host "$platform package size: $totalSizeMB MB" -ForegroundColor Cyan

              # 압축
              $compressionLevel = if ($platform -eq "x86") { "Fastest" } else { $env:COMPRESSION_LEVEL }
              Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-$platform-Release.zip" -CompressionLevel $compressionLevel

              Write-Host "$platform package created" -ForegroundColor Green
            } else {
              Write-Host "No $platform build files found!" -ForegroundColor Red
              exit 1
            }

            cd ..
          } else {
            Write-Host "$platform build directory not found!" -ForegroundColor Red
            exit 1
          }
        }

        Write-Host "All platform packages created" -ForegroundColor Green

    - name: Verify Platform Builds
      run: |
        Write-Host "=== Verifying Platform Builds ===" -ForegroundColor Green

        $platforms = @("x86", "x64", "ARM64")

        foreach ($platform in $platforms) {
          $zipPath = "MacType-$platform-Release.zip"
          if (Test-Path $zipPath) {
            Write-Host "Found $platform build package: $zipPath" -ForegroundColor Green
            $size = (Get-Item $zipPath).Length / 1MB
            Write-Host "Size: $([math]::Round($size, 2)) MB" -ForegroundColor Cyan
          } else {
            Write-Host "ERROR: $platform ZIP not found!" -ForegroundColor Red
            exit 1
          }
        }

        Write-Host "All platform builds verified successfully" -ForegroundColor Green

    - name: Upload All Platform Builds
      uses: actions/upload-artifact@v4
      with:
        name: MacType-All-Platforms-Release
        path: MacType-*-Release.zip
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: Create Release Packages
    runs-on: windows-latest
    needs: [build-manager, build-agents]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Organize and package release files
      run: |
        Write-Host "=== Creating Release Packages ===" -ForegroundColor Green
        mkdir release-files

        # Copy all artifacts to release directory
        Write-Host "Copying artifacts to release directory..." -ForegroundColor Cyan
        Copy-Item -Path "artifacts\*" -Destination "release-files\" -Recurse -Force

        # Create final release package
        Write-Host "Creating final release package..." -ForegroundColor Cyan
        Compress-Archive -Path "release-files\*" -DestinationPath "MacType-Release.zip" -CompressionLevel Optimal

        Write-Host "Release package created successfully" -ForegroundColor Green

    - name: Upload Release Package
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release
        path: MacType-Release.zip
        retention-days: 30

  deploy-release:
    name: Deploy Release
    runs-on: windows-latest
    needs: create-release
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - name: Download Release Package
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release
        path: release

    - name: Deploy to Release
      run: |
        Write-Host "=== Deploying Release ===" -ForegroundColor Green

        # List contents of release directory
        Write-Host "Release contents:" -ForegroundColor Cyan
        Get-ChildItem -Path "release" -Recurse

        Write-Host "Deployment completed (mock deployment)" -ForegroundColor Green
