name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.configuration }}
    runs-on: windows-latest
    timeout-minutes: 45  # 빌드 시간 단축

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # 히스토리 최소화로 속도 향상

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Cache Windows App SDK
      id: cache-windows-app-sdk
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files\WindowsApps\Microsoft.WindowsAppSDK.*
          C:\Program Files (x86)\WindowsApps\Microsoft.WindowsAppSDK.*
        key: windows-app-sdk-1.4-${{ runner.os }}
        restore-keys: |
          windows-app-sdk-1.4-
          windows-app-sdk-

    - name: Install Windows App SDK
      if: steps.cache-windows-app-sdk.outputs.cache-hit != 'true'
      run: |
        Write-Host "Installing Windows App SDK..." -ForegroundColor Green
        winget install Microsoft.WindowsAppSDK.1.4 --accept-package-agreements --accept-source-agreements --silent --force

    - name: Add Windows SDK to PATH and set compatible SDK version
      run: |
        echo "=== 설치된 Windows SDK 버전들 ==="
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name
        $sdkVersions | ForEach-Object { echo "  - $($_.Name)" }
        $preferredVersions = @("10.0.26100.0", "10.0.22621.0", "10.0.22000.0", "10.0.20348.0", "10.0.19041.0")
        $selectedSdk = $null
        foreach ($version in $preferredVersions) {
          $sdkIncludePath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$version"
          if (Test-Path $sdkIncludePath) { $selectedSdk = $version; echo "선택된 Windows SDK: $version"; break }
        }
        if (-not $selectedSdk -and $sdkVersions) {
          $newestSdk = $sdkVersions | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending | Select-Object -First 1
          if ($newestSdk) { $selectedSdk = $newestSdk.Name; echo "최신 Windows SDK 사용: $selectedSdk" } else { $selectedSdk = $sdkVersions[0].Name; echo "기본 Windows SDK 사용: $selectedSdk" }
        }
        if ($selectedSdk) {
          echo "WindowsSDKVersion=$selectedSdk" >> $env:GITHUB_ENV
          echo "WINDOWS_SDK_VERSION=$selectedSdk" >> $env:GITHUB_ENV
          # 플랫폼별 SDK bin 경로 설정
          $sdkBinPath = switch ("${{ matrix.platform }}") {
            "x86" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x86" }
            "x64" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64" }
            "ARM64" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\arm64" }  # ARM64 네이티브 컴파일
            default { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64" }
          }
          if (Test-Path $sdkBinPath) { echo "$sdkBinPath" >> $env:GITHUB_PATH }
        }
        echo "=== Visual Studio 설치 확인 ==="
        Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\" -ErrorAction SilentlyContinue

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          cd vcpkg
        }
        echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Install dependencies via vcpkg
      run: |
        $triplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        Write-Host "Installing dependencies for $triplet..." -ForegroundColor Cyan

        # 병렬 설치 및 캐시 활용
        .\vcpkg\vcpkg.exe install --triplet $triplet --binarycaching

        Write-Host "Dependencies installed successfully" -ForegroundColor Green

    - name: Configure and Build
      run: |
        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build

        # 플랫폼별 설정
        $generatorPlatform = switch ("${{ matrix.platform }}") {
            "x64" { "x64" }
            "x86" { "Win32" }
            "ARM64" { "ARM64" }
            default { "x64" }
        }
        $vcpkgTriplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }
        $buildAgentFlag = switch ("${{ matrix.platform }}") {
            "x86" { "OFF" }
            "x64" { "ON" }
            "ARM64" { "ON" }
            default { "ON" }
        }

        # 최적화된 CMake 구성
        Write-Host "Configuring CMake for $generatorPlatform..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
          -DCMAKE_GENERATOR_PLATFORM=$generatorPlatform `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$vcpkgTriplet `
          -DBUILD_MODERN_AGENT=$buildAgentFlag `
          -DCMAKE_CXX_FLAGS="/MP /O2"  # 병렬 컴파일 및 최적화

        # 병렬 빌드
        Write-Host "Building with Ninja (parallel: $env:NUMBER_OF_PROCESSORS cores)..." -ForegroundColor Cyan
        cmake --build . --config ${{ matrix.configuration }} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create artifact archive
      run: |
        cd build
        Write-Host "Creating compressed artifact archive..." -ForegroundColor Cyan
        Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip" -CompressionLevel Optimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MacType-${{ matrix.platform }}-${{ matrix.configuration }}
        path: MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip
        retention-days: 30
        if-no-files-found: error

    - name: List build results
      run: |
        Write-Host "Build completed successfully!" -ForegroundColor Green
        Write-Host "Generated files:" -ForegroundColor Cyan
        Get-ChildItem -Path build -Include *.exe, *.dll -Recurse | ForEach-Object {
          Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)"
        }

  create-installer:
    name: Create Windows Installer
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Extract artifacts
      run: |
        Write-Host "Extracting build artifacts..." -ForegroundColor Cyan
        Get-ChildItem -Path artifacts -Directory | ForEach-Object {
          $artifactPath = $_.FullName
          Get-ChildItem -Path $artifactPath -Filter "*.zip" | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath "installer/bin" -Force
          }
        }

    - name: Cache NSIS
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\NSIS
        key: nsis-${{ runner.os }}

    - name: Setup NSIS
      if: steps.cache-nsis.outputs.cache-hit != 'true'
      run: choco install nsis -y --no-progress

    - name: Build Windows installer
      run: |
        if (Test-Path "installer/mactype-universal.iss") {
          Write-Host "Building Windows installer..." -ForegroundColor Cyan
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\mactype-universal.iss
        }

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Windows-Installer
        path: installer/Output/*.exe
        retention-days: 30

  create-release:
    name: Create Release Archive
    runs-on: windows-latest
    needs: [build, create-installer]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Extract and organize files
      run: |
        Write-Host "Organizing release files..." -ForegroundColor Cyan
        mkdir release-files

        # Extract platform-specific builds
        Get-ChildItem -Path artifacts -Filter "MacType-*-Release.zip" | ForEach-Object {
          $platform = $_.Name -replace "MacType-(.+)-Release\.zip", '$1'
          Expand-Archive -Path $_.FullName -DestinationPath "release-files/$platform"
        }

        # Copy installer if exists
        if (Test-Path "artifacts/MacType-Windows-Installer") {
          Copy-Item "artifacts/MacType-Windows-Installer/*.exe" "release-files/"
        }

    - name: Create release archives
      run: |
        Write-Host "Creating release archives..." -ForegroundColor Cyan

        # Create combined archive
        Compress-Archive -Path release-files/* -DestinationPath MacType-Windows-Complete.zip -CompressionLevel Optimal

        # Create separate platform archives
        Get-ChildItem -Path release-files -Directory | ForEach-Object {
          $platform = $_.Name
          Compress-Archive -Path "release-files/$platform/*" -DestinationPath "MacType-Windows-$platform.zip" -CompressionLevel Optimal
        }

    - name: Upload release archives
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release-Archives
        path: |
          MacType-Windows-*.zip
        retention-days: 60

  deploy-release:
    name: Deploy Release
    runs-on: windows-latest
    needs: create-release
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release-Archives
        path: release-assets

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
