name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]
        configuration: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg
      run: |
        # vcpkg 설치 (full clone으로 변경)
        if (!(Test-Path "vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git
        }
        cd vcpkg
        if (!(Test-Path "vcpkg.exe")) {
          .\bootstrap-vcpkg.bat -disableMetrics
        }

        # vcpkg를 PATH에 추가
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Restore vcpkg dependencies
      run: |
        # 플랫폼별 triplet 설정
        $triplet = if ("${{ matrix.platform }}" -eq "x64") { "x64-windows" } else { "x86-windows" }

        # 매니페스트 모드에서 vcpkg.json에 정의된 의존성들을 설치
        .\vcpkg\vcpkg.exe install --triplet $triplet

        # 환경 변수 설정
        echo "VCPKG_ROOT=$PWD\vcpkg" >> $env:GITHUB_ENV

    - name: Configure CMake
      run: |
        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        New-Item -ItemType Directory -Path build
        cd build

        # vcpkg toolchain 경로 확인 및 설정
        $vcpkgToolchain = "$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake"
        if (!(Test-Path $vcpkgToolchain)) {
          Write-Host "vcpkg toolchain not found at: $vcpkgToolchain"
          Write-Host "Current directory: $PWD"
          Get-ChildItem -Path "$PWD/../vcpkg" -Recurse -Filter "vcpkg.cmake" | Select-Object FullName
          exit 1
        }

        Write-Host "Using vcpkg toolchain: $vcpkgToolchain"
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_GENERATOR_PLATFORM=${{ matrix.platform == 'x64' && 'x64' || 'Win32' }} -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" -DVCPKG_TARGET_TRIPLET=${{ matrix.platform == 'x64' && 'x64-windows' || 'x86-windows' }}

    - name: Build with CMake
      run: |
        cd build
        cmake --build . --config ${{ matrix.configuration }} --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mactype-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          build/src/**/*.dll
          build/src/**/*.exe
        retention-days: 30

  create-installer:
    name: Create Windows Installer
    runs-on: windows-latest
    needs: build
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Setup NSIS
      run: |
        choco install nsis -y

    - name: Build Windows installer
      run: |
        Write-Host "Windows installer 빌드 시작..." -ForegroundColor Green
        # Windows installer 스크립트 사용
        if (Test-Path "installer/mactype-universal.iss") {
          Write-Host "MacType Windows 인스톨러 빌드 중..." -ForegroundColor Cyan
          & "C:\Program Files (x86)\NSIS\makensis.exe" .\installer\mactype-universal.iss
        } else {
          Write-Host "인스톨러 스크립트 미발견, 건너뜀" -ForegroundColor Yellow
        }

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: mactype-windows-installer
        path: |
          installer/Output/*.exe
          installer/Output/*.msi
        retention-days: 30

  release:
    name: Release
    runs-on: windows-latest
    needs: [build, create-installer]
    if: github.event_name == 'release'
    timeout-minutes: 30

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archive
      run: |
        Write-Host "릴리즈 아카이브 생성 중..." -ForegroundColor Green
        Compress-Archive -Path artifacts/mactype-*-Release/* -DestinationPath MacType-Windows.zip

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          MacType-Windows.zip
          artifacts/mactype-windows-installer/*.exe
        token: ${{ secrets.GITHUB_TOKEN }}
