name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_CONFIGURATION: Release
  SOLUTION_FILE_PATH: ./gdipp.sln

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform: [x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Add Windows SDK to PATH and set compatible SDK version
      run: |
        echo "=== 설치된 Windows SDK 버전들 ==="
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name
        $sdkVersions | ForEach-Object { echo "  - $($_.Name)" }
        $preferredVersions = @("10.0.26100.0", "10.0.22621.0", "10.0.22000.0", "10.0.20348.0", "10.0.19041.0")
        $selectedSdk = $null
        foreach ($version in $preferredVersions) {
          $sdkIncludePath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$version"
          if (Test-Path $sdkIncludePath) { $selectedSdk = $version; echo "선택된 Windows SDK: $version"; break }
        }
        if (-not $selectedSdk -and $sdkVersions) {
          $newestSdk = $sdkVersions | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending | Select-Object -First 1
          if ($newestSdk) { $selectedSdk = $newestSdk.Name; echo "최신 Windows SDK 사용: $selectedSdk" } else { $selectedSdk = $sdkVersions[0].Name; echo "기본 Windows SDK 사용: $selectedSdk" }
        }
        if ($selectedSdk) {
          echo "WindowsSDKVersion=$selectedSdk" >> $env:GITHUB_ENV
          echo "WINDOWS_SDK_VERSION=$selectedSdk" >> $env:GITHUB_ENV
          $sdkBinPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64"
          if (Test-Path $sdkBinPath) { echo "$sdkBinPath" >> $env:GITHUB_PATH }
        }
        echo "=== Visual Studio 설치 확인 ==="
        Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\" -ErrorAction SilentlyContinue

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          lib/
          deps/
        key: ${{ runner.os }}-deps-${{ hashFiles('**/HOWTOBUILD.md') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Create directories
      run: |
        New-Item -ItemType Directory -Force -Path lib
        New-Item -ItemType Directory -Force -Path deps

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ matrix.platform }}-
          vcpkg-

    - name: Setup vcpkg
      run: |
        if (!(Test-Path "vcpkg")) { git clone https://github.com/Microsoft/vcpkg.git vcpkg }
        cd vcpkg
        if (!(Test-Path "vcpkg.exe")) { .\bootstrap-vcpkg.bat }
        echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Install detours and deps via vcpkg (manifest, x64)
      run: |
        .\vcpkg\vcpkg.exe install --triplet x64-windows
        echo "VCPKG_INSTALLED_DIR=$PWD\vcpkg\installed" >> $env:GITHUB_ENV
        echo "VCPKG_TARGET_TRIPLET=x64-windows" >> $env:GITHUB_ENV

    - name: Build modern dependencies (vcpkg-based)
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        .\scripts\build-modern-dependencies.ps1 -Platform ${{ matrix.platform }} -Configuration ${{ env.BUILD_CONFIGURATION }}
        echo "CMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

    - name: Build MacType
      run: |
        $msbuildPlatform = switch ("${{ matrix.platform }}") { "x86" { "Win32" } "x64" { "x64" } "ARM64" { "ARM64" } default { "x64" } }
        $sdkVersion = $env:WINDOWS_SDK_VERSION; if (-not $sdkVersion) { $sdkVersion = "10.0.26100.0" }
        echo "사용할 Windows SDK 버전: $sdkVersion"
        msbuild ${{ env.SOLUTION_FILE_PATH }} -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:Platform=$msbuildPlatform -p:WindowsTargetPlatformVersion=$sdkVersion -p:UseMultiToolTask=true -p:EnforceProcessCountAcrossBuilds=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mactype-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
        retention-days: 30

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: mactype-release-${{ matrix.platform }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
name: Windows Build (Rel+Detours x64)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main", "directwrite"]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies via vcpkg (manifest, x64)
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Build (Rel+Detours x64, sequential)
        shell: pwsh
        run: |
          msbuild gdipp.sln /p:Configuration="Rel+Detours" /p:Platform="x64" /p:BuildInParallel=false /p:VcpkgEnableManifest=true /p:VcpkgRoot=C:\vcpkg /p:VcpkgTriplet=x64-windows | cat

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mactype-x64-RelDetours
          path: |
            x64/Rel+Detours/**
            Rel+Detours/**
            **/*.dll
            **/*.exe
          retention-days: 14
