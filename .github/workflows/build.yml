name: Build MacType Universal

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Build Configuration
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  COMPRESSION_LEVEL: Optimal
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 16

  # vcpkg Configuration
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  VCPKG_DEFAULT_TRIPLET: 'x64-windows'

  # Windows SDK Configuration
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  WINDOWS_APP_SDK_VERSION: '1.4.231008000'

  # Performance Configuration
  NINJA_MAX_JOBS: 16
  MSBUILD_MAX_CPU_COUNT: 16

  # Paths
  BUILD_CACHE_DIR: '${{ github.workspace }}/build-cache'
  VCPKG_CACHE_DIR: '${{ github.workspace }}/vcpkg-cache'
  ARTIFACT_CACHE_DIR: '${{ github.workspace }}/artifacts'

jobs:
  # 환경 검증 및 사전 준비
  validate-environment:
    name: Validate Environment
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      runner-info: ${{ steps.runner-info.outputs.info }}
      windows-version: ${{ steps.runner-info.outputs.windows-version }}

    steps:
    - name: Gather runner information
      id: runner-info
      run: |
        Write-Host "=== Windows Runner Information ===" -ForegroundColor Green

        $osInfo = Get-ComputerInfo
        $windowsVersion = "$($osInfo.WindowsProductName) $($osInfo.WindowsVersion)"
        Write-Host "Windows Version: $windowsVersion" -ForegroundColor Cyan

        $cpuInfo = Get-WmiObject Win32_Processor
        $cpuName = $cpuInfo.Name -replace '[^a-zA-Z0-9\s\-_]', ''  # 특수 문자 제거
        Write-Host "CPU: $cpuName" -ForegroundColor Cyan
        Write-Host "Cores: $($cpuInfo.NumberOfCores)" -ForegroundColor Cyan
        Write-Host "Logical Processors: $($cpuInfo.NumberOfLogicalProcessors)" -ForegroundColor Cyan

        $memory = Get-WmiObject Win32_ComputerSystem
        $memoryGB = [math]::Round($memory.TotalPhysicalMemory / 1GB, 1)
        Write-Host "Memory: $memoryGB GB" -ForegroundColor Cyan

        $disk = Get-WmiObject Win32_LogicalDisk -Filter "DeviceID='C:'"
        $diskGB = [math]::Round($disk.Size / 1GB, 1)
        Write-Host "Disk Space: $diskGB GB" -ForegroundColor Cyan

        # 안전한 JSON 생성 (특수 문자 이스케이프 및 한 줄로 변환)
        $windowsVersionSafe = $windowsVersion -replace '[\\"]', '\\$&' -replace '`n', '\\n' -replace '`r', '\\r'
        $cpuNameSafe = $cpuName -replace '[\\"]', '\\$&' -replace '`n', '\\n' -replace '`r', '\\r'

        $jsonInfo = "{`"windows_version`":`"$windowsVersionSafe`",`"cpu_name`":`"$cpuNameSafe`",`"cpu_cores`":$($cpuInfo.NumberOfCores),`"memory_gb`":$memoryGB,`"disk_gb`":$diskGB}"

        Write-Host "Generated JSON: $jsonInfo" -ForegroundColor Gray

        # GitHub Output에 안전하게 기록
        echo "info=$jsonInfo" >> $env:GITHUB_OUTPUT
        echo "windows-version=$windowsVersionSafe" >> $env:GITHUB_OUTPUT

        Write-Host "Runner information gathered successfully" -ForegroundColor Green

  # 공통 환경 설정 및 의존성 설치
  setup-environment:
    name: Setup Build Environment
    runs-on: windows-latest
    needs: validate-environment
    timeout-minutes: 25
    outputs:
      vcpkg-root: ${{ steps.setup-vcpkg.outputs.vcpkg-root }}
      cmake-version: ${{ steps.setup-cmake.outputs.cmake-version }}
      setup-duration: ${{ steps.setup-complete.outputs.duration }}
      setup-time: ${{ steps.setup-complete.outputs.setup-time }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup CMake
      id: setup-cmake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Cache Windows SDK
      id: cache-windows-sdk
      uses: actions/cache@v4
      with:
        path: |
          C:\Program Files (x86)\Windows Kits\10\bin\${{ env.WINDOWS_SDK_VERSION }}\*
          C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\bin\${{ env.WINDOWS_SDK_VERSION }}\*
        key: windows-sdk-${{ env.WINDOWS_SDK_VERSION }}
        restore-keys: |
          windows-sdk-

    - name: Setup Windows App SDK
      if: steps.cache-windows-sdk.outputs.cache-hit != 'true'
      run: |
        Write-Host "=== Setting up Windows App SDK ===" -ForegroundColor Green

        # Windows App SDK가 이미 설치되었는지 확인
        $appxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe"
        $makeappxPath = "${env:ProgramFiles}\Microsoft SDKs\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe"

        $alreadyInstalled = $false
        if (Test-Path $appxPath) {
          Write-Host "Windows App SDK already installed (makeappx.exe found)" -ForegroundColor Green
          $alreadyInstalled = $true
        } elseif (Test-Path $makeappxPath) {
          Write-Host "Windows App SDK already installed (makeappx.exe found)" -ForegroundColor Green
          $alreadyInstalled = $true
        }

        if ($alreadyInstalled) {
          Write-Host "Skipping Windows App SDK installation" -ForegroundColor Cyan
          exit 0
        }

        # 여러 버전의 Windows App SDK 시도
        $sdkVersions = @(
          "1.4.231008000",
          "1.4.231008003",
          "1.4.231008004",
          "1.4.231008005"
        )

        $installationSuccess = $false

        foreach ($version in $sdkVersions) {
          Write-Host "Trying Windows App SDK version $version..." -ForegroundColor Cyan

          $sdkUrl = "https://aka.ms/windowsappsdk/$version/windowsappruntimeinstall-x64.exe"
          $installerPath = "$env:TEMP\WindowsAppRuntimeInstall-$version.exe"

          try {
            Write-Host "Downloading Windows App Runtime..." -ForegroundColor Gray
            Invoke-WebRequest -Uri $sdkUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 300

            # 파일 무결성 검증 (파일 크기 확인)
            $fileSize = (Get-Item $installerPath).Length
            if ($fileSize -lt 1MB) {
              Write-Host "Downloaded file is too small ($fileSize bytes), skipping..." -ForegroundColor Yellow
              continue
            }

            Write-Host "Installing Windows App Runtime..." -ForegroundColor Gray
            $installProcess = Start-Process -FilePath $installerPath -ArgumentList "/silent", "/norestart" -Wait -NoNewWindow -PassThru

            if ($installProcess.ExitCode -eq 0) {
              Write-Host "Windows App SDK $version installed successfully" -ForegroundColor Green
              $installationSuccess = $true
              break
            } else {
              Write-Host "Windows App SDK $version installation failed with exit code: $($installProcess.ExitCode)" -ForegroundColor Yellow
            }
          }
          catch {
            Write-Host "Windows App SDK $version installation error: $($_.Exception.Message)" -ForegroundColor Yellow
          }
          finally {
            if (Test-Path $installerPath) {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
            }
          }
        }

        if (-not $installationSuccess) {
          Write-Host "All Windows App SDK installation attempts failed, but continuing build..." -ForegroundColor Yellow
          Write-Host "Note: Universal Windows Platform features may not be available" -ForegroundColor Gray
        }

    - name: Verify Windows Development Environment
      run: |
        Write-Host "=== Verifying Windows Development Environment ===" -ForegroundColor Green

        # Check Windows SDK versions
        $sdkPaths = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\Include\",
          "C:\Program Files (x86)\Windows Kits\10\Include\"
        )

        $foundSdk = $false
        foreach ($sdkPath in $sdkPaths) {
          if (Test-Path $sdkPath) {
            $sdkVersions = Get-ChildItem $sdkPath -Directory -ErrorAction SilentlyContinue
            if ($sdkVersions) {
              $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
              Write-Host "Windows SDK found: $($latestSdk.Name)" -ForegroundColor Green
              $foundSdk = $true
              break
            }
          }
        }

        if (-not $foundSdk) {
          Write-Host "Windows SDK not found" -ForegroundColor Yellow
        }

        # Check MSVC
        $msvcPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\"
        if (Test-Path $msvcPath) {
          $msvcVersions = Get-ChildItem $msvcPath -Directory -ErrorAction SilentlyContinue
          if ($msvcVersions) {
            $latestMsvc = $msvcVersions | Sort-Object Name -Descending | Select-Object -First 1
            Write-Host "MSVC found: $($latestMsvc.Name)" -ForegroundColor Green
          }
        }

        Write-Host "Windows development environment verification complete" -ForegroundColor Green

    - name: Cache vcpkg installation
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          ${{ env.VCPKG_CACHE_DIR }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-v2
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      id: setup-vcpkg
      run: |
        Write-Host "=== Setting up vcpkg ===" -ForegroundColor Green

        if (!(Test-Path "vcpkg")) {
          Write-Host "Cloning vcpkg repository..." -ForegroundColor Cyan
          git clone https://github.com/Microsoft/vcpkg.git --depth 1 --branch master

          Write-Host "Bootstrapping vcpkg..." -ForegroundColor Cyan
          cd vcpkg

          # Try bootstrap with fallback options
          $bootstrapSuccess = $false

          # First try: standard bootstrap (without useSystemBinaries)
          try {
            Write-Host "Trying standard bootstrap..." -ForegroundColor Gray
            .\bootstrap-vcpkg.bat -disableMetrics
            if ($LASTEXITCODE -eq 0) {
              $bootstrapSuccess = $true
              Write-Host "Standard bootstrap successful" -ForegroundColor Green
            }
          }
          catch {
            Write-Host "Standard bootstrap failed, trying alternative..." -ForegroundColor Yellow
          }

          # Second try: PowerShell bootstrap script
          if (-not $bootstrapSuccess) {
            try {
              Write-Host "Trying PowerShell bootstrap..." -ForegroundColor Gray
              .\scripts\bootstrap.ps1 -DisableMetrics
              if ($LASTEXITCODE -eq 0) {
                $bootstrapSuccess = $true
                Write-Host "PowerShell bootstrap successful" -ForegroundColor Green
              }
            }
            catch {
              Write-Host "PowerShell bootstrap failed: $($_.Exception.Message)" -ForegroundColor Yellow
            }
          }

          if (-not $bootstrapSuccess) {
            Write-Host "All bootstrap methods failed, checking if vcpkg.exe exists..." -ForegroundColor Yellow
            if (Test-Path "vcpkg.exe") {
              Write-Host "vcpkg.exe found despite bootstrap failure, continuing..." -ForegroundColor Green
              $bootstrapSuccess = $true
            } else {
              throw "vcpkg bootstrap failed completely"
            }
          }
        } else {
          Write-Host "Using cached vcpkg..." -ForegroundColor Green
          cd vcpkg
        }

        # Get vcpkg root path
        $vcpkgRoot = (Get-Location).Path
        Write-Host "vcpkg root: $vcpkgRoot" -ForegroundColor Cyan

        # Set environment variables
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH
        echo "vcpkg-root=$vcpkgRoot" >> $env:GITHUB_OUTPUT

        # Verify vcpkg installation with full path
        $vcpkgExePath = Join-Path $vcpkgRoot "vcpkg.exe"
        if (Test-Path $vcpkgExePath) {
          try {
            $vcpkgVersion = & $vcpkgExePath version 2>&1
            Write-Host "vcpkg version: $($vcpkgVersion[0])" -ForegroundColor Green
          }
          catch {
            Write-Host "Could not get vcpkg version: $($_.Exception.Message)" -ForegroundColor Yellow
          }
        } else {
          Write-Host "Warning: vcpkg.exe not found at $vcpkgExePath" -ForegroundColor Yellow
        }

        cd ..
        Write-Host "vcpkg setup complete" -ForegroundColor Green

    - name: Pre-install common dependencies
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        Write-Host "=== Pre-installing common dependencies ===" -ForegroundColor Green

        $vcpkgRoot = "${{ steps.setup-vcpkg.outputs.vcpkg-root }}"
        $vcpkgExePath = Join-Path $vcpkgRoot "vcpkg.exe"

        if (!(Test-Path $vcpkgExePath)) {
          Write-Host "vcpkg.exe not found, skipping pre-installation" -ForegroundColor Yellow
          exit 0
        }

        Write-Host "Using vcpkg: $vcpkgExePath" -ForegroundColor Cyan

        # Pre-download common packages for all triplets
        $triplets = @("x86-windows", "x64-windows", "arm64-windows")
        $commonPackages = @(
          "freetype",
          "libpng",
          "zlib",
          "brotli",
          "detours",
          "nlohmann-json"
        )

        foreach ($triplet in $triplets) {
          Write-Host "Pre-downloading for $triplet..." -ForegroundColor Cyan
          foreach ($package in $commonPackages) {
            try {
              Write-Host "  Pre-downloading $package..." -ForegroundColor Gray
              & $vcpkgExePath install $package --triplet $triplet --only-downloads --binarycaching 2>&1 | Out-Null
              Write-Host "    $package downloaded for $triplet" -ForegroundColor Green
            }
            catch {
              Write-Host "    Failed to download $package for $triplet : $($_.Exception.Message)" -ForegroundColor Yellow
            }
          }
        }

        Write-Host "Common dependencies pre-downloaded" -ForegroundColor Green

    - name: Complete setup
      id: setup-complete
      run: |
        Write-Host "=== Completing environment setup ===" -ForegroundColor Green

        # 환경 검증
        $vcpkgRoot = "${{ steps.setup-vcpkg.outputs.vcpkg-root }}"
        $vcpkgExePath = Join-Path $vcpkgRoot "vcpkg.exe"

        if (!(Test-Path $vcpkgExePath)) {
          Write-Host "ERROR: vcpkg.exe not found at expected location: $vcpkgExePath" -ForegroundColor Red
          exit 1
        }

        if (!(Test-Path "vcpkg")) {
          Write-Host "ERROR: vcpkg directory not found" -ForegroundColor Red
          exit 1
        }

        # 설정 완료 시간 기록
        $setupStartTime = Get-Date
        $setupTime = $setupStartTime.ToString("o")
        $duration = [math]::Round((Get-Date - $setupStartTime).TotalSeconds, 2)

        echo "setup-time=$setupTime" >> $env:GITHUB_OUTPUT
        echo "duration=$duration" >> $env:GITHUB_OUTPUT

        Write-Host "Environment setup completed successfully" -ForegroundColor Green
        Write-Host "vcpkg root: $vcpkgRoot" -ForegroundColor Cyan
        Write-Host "vcpkg executable: $vcpkgExePath" -ForegroundColor Cyan
        Write-Host "Total setup duration: $duration seconds" -ForegroundColor Cyan

        # 최종 상태 확인
        Write-Host "Setup verification:" -ForegroundColor Cyan
        Write-Host "  ✓ vcpkg available: $(Test-Path $vcpkgExePath)" -ForegroundColor Green
        Write-Host "  ✓ CMake available: $(Get-Command cmake -ErrorAction SilentlyContinue)" -ForegroundColor Green
        Write-Host "  ✓ Ninja available: $(Get-Command ninja -ErrorAction SilentlyContinue)" -ForegroundColor Green

        Write-Host "Environment setup completed successfully!" -ForegroundColor Green

  # Universal Manager 빌드 (x64 + ARM64 지원)
  build-manager:
    name: Build Universal MacType Manager
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 25
    outputs:
      build-time: ${{ steps.build-manager.outputs.build-time }}
      package-size: ${{ steps.package-manager.outputs.package-size }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup build environment
      run: |
        Write-Host "=== Setting up build environment ===" -ForegroundColor Green

        # Restore vcpkg environment
        $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH

        Write-Host "vcpkg root: $vcpkgRoot" -ForegroundColor Cyan

        # Create build directory
        if (Test-Path "build-manager") {
          Remove-Item -Recurse -Force build-manager
        }
        mkdir build-manager
        cd build-manager

    - name: Configure Universal Manager
      run: |
        Write-Host "=== Configuring Universal MacType Manager ===" -ForegroundColor Green

        cd build-manager

        # Verify vcpkg toolchain
        $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
        $vcpkgToolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake"

        if (!(Test-Path $vcpkgToolchain)) {
          Write-Host "ERROR: vcpkg toolchain not found at $vcpkgToolchain" -ForegroundColor Red
          exit 1
        }

        Write-Host "vcpkg toolchain found: $vcpkgToolchain" -ForegroundColor Green

        # Configure with Visual Studio generator for UWP support
        Write-Host "Configuring Universal Windows App (x64 + ARM64)..." -ForegroundColor Cyan

        $cmakeArgs = @(
            "..",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}",
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DBUILD_MODERN_MANAGER=ON",
            "-DCMAKE_SYSTEM_NAME=WindowsStore",
            "-DCMAKE_SYSTEM_VERSION=10.0",
            "-DCMAKE_CXX_FLAGS=/MP /O2 /DNDEBUG",
            "-DCMAKE_C_FLAGS=/MP /O2 /DNDEBUG"
        )

        Write-Host "CMake arguments: $($cmakeArgs -join ' ')" -ForegroundColor Gray

        $configStart = Get-Date
        & cmake @cmakeArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Host "CMake configuration failed" -ForegroundColor Red
          exit 1
        }

        $configEnd = Get-Date
        $configTime = ($configEnd - $configStart).TotalSeconds
        Write-Host "Configuration completed in $($configTime.ToString("F1"))s" -ForegroundColor Green

    - name: Build Universal Manager
      id: build-manager
      run: |
        Write-Host "=== Building Universal MacType Manager ===" -ForegroundColor Green

        cd build-manager

        # Build with MSBuild for UWP support
        $buildStart = Get-Date
        Write-Host "Building with MSBuild..." -ForegroundColor Cyan

        $msbuildArgs = @(
            "MacTypeManager.vcxproj",
            "/p:Configuration=${{ env.BUILD_TYPE }}",
            "/p:Platform=x64",
            "/p:AppxBundle=Always",
            "/p:UapAppxPackageBuildMode=SideloadOnly",
            "/p:WindowsAppSDKBootstrapAutoInitializeOptions_Platform=x64;ARM64",
            "/maxCpuCount:${{ env.MSBUILD_MAX_CPU_COUNT }}",
            "/verbosity:minimal"
        )

        & msbuild @msbuildArgs

        if ($LASTEXITCODE -ne 0) {
          Write-Host "MSBuild failed" -ForegroundColor Red
          exit 1
        }

        $buildEnd = Get-Date
        $buildTime = ($buildEnd - $buildStart).TotalSeconds
        echo "build-time=$buildTime" >> $env:GITHUB_OUTPUT

        Write-Host "Build completed in $($buildTime.ToString("F1"))s" -ForegroundColor Green

    - name: Package Universal Manager
      id: package-manager
      run: |
        Write-Host "=== Packaging Universal MacType Manager ===" -ForegroundColor Green

        cd build-manager

        # Find built artifacts
        $appxFiles = Get-ChildItem -Path "." -Include "*.msix", "*.appx" -Recurse -ErrorAction SilentlyContinue

        if ($appxFiles.Count -eq 0) {
          Write-Host "ERROR: No MSIX/APKX files found" -ForegroundColor Red
          exit 1
        }

        $totalSize = 0
        foreach ($file in $appxFiles) {
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          $totalSize += $file.Length
          Write-Host "Found package: $($file.Name) ($sizeMB MB)" -ForegroundColor Cyan
        }

        $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
        echo "package-size=$totalSizeMB" >> $env:GITHUB_OUTPUT

        Write-Host "Total package size: $totalSizeMB MB" -ForegroundColor Green

    - name: Upload Universal Manager
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: build-manager/*.msix
        retention-days: 30
        if-no-files-found: error

  # 플랫폼별 에이전트 + 코어 빌드 (x64 호스트에서 크로스 컴파일)
  build-agents:
    name: Build All Platforms (x64 Host)
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 35
    outputs:
      build-times: ${{ steps.build-platforms.outputs.build-times }}
      total-size: ${{ steps.package-platforms.outputs.total-size }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup build environment
      run: |
        Write-Host "=== Setting up build environment ===" -ForegroundColor Green

        # Restore vcpkg environment
        $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH

        Write-Host "vcpkg root: $vcpkgRoot" -ForegroundColor Cyan

    - name: Install platform dependencies
      run: |
        Write-Host "=== Installing Multi-Platform Dependencies ===" -ForegroundColor Green

        # vcpkg 경로 설정
        $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
        $vcpkgExe = "$vcpkgRoot/vcpkg.exe"

        if (!(Test-Path $vcpkgExe)) {
          Write-Host "ERROR: vcpkg.exe not found at $vcpkgExe" -ForegroundColor Red
          exit 1
        }

        Write-Host "Using vcpkg: $vcpkgExe" -ForegroundColor Cyan

        # 모든 플랫폼의 의존성을 한 번에 설치
        $platforms = @("x86-windows", "x64-windows", "arm64-windows")

        foreach ($triplet in $platforms) {
          Write-Host "Installing dependencies for $triplet..." -ForegroundColor Cyan

          $installArgs = @(
              "install",
              "--triplet", $triplet,
              "--binarycaching",
              "--downloads-root", "$PWD\vcpkg-downloads",
              "--x-buildtrees-root", "$PWD\vcpkg-buildtrees",
              "--x-install-root", "$PWD\vcpkg-installed",
              "--x-packages-root", "$PWD\vcpkg-packages"
          )

          & $vcpkgExe @installArgs
          Write-Host "Dependencies for $triplet installed successfully" -ForegroundColor Green
        }

        Write-Host "All platform dependencies ready" -ForegroundColor Green

    - name: Build all platforms
      id: build-platforms
      run: |
        Write-Host "=== Building All Platforms (x64 Host) ===" -ForegroundColor Green

        # 플랫폼별 빌드 설정
        $platforms = @(
          @{Name="x86"; Platform="Win32"; Triplet="x86-windows"; Agent="OFF"; Manager="OFF"; Desc="32-bit Core DLL"},
          @{Name="x64"; Platform="x64"; Triplet="x64-windows"; Agent="ON"; Manager="OFF"; Desc="64-bit Agent + Core"},
          @{Name="ARM64"; Platform="ARM64"; Triplet="arm64-windows"; Agent="ON"; Manager="OFF"; Desc="ARM64 Agent + Core"}
        )

        $buildTimes = @{}
        $totalBuildStart = Get-Date

        foreach ($plat in $platforms) {
          Write-Host "Building $($plat.Name) ($($plat.Desc))..." -ForegroundColor Cyan

          $buildDir = "build-$($plat.Name)"
          if (Test-Path $buildDir) {
            Remove-Item -Recurse -Force $buildDir
          }
          mkdir $buildDir
          cd $buildDir

          # vcpkg 경로 설정
          $vcpkgRoot = "${{ needs.setup-environment.outputs.vcpkg-root }}"
          $vcpkgToolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake"

          # 플랫폼별 CMake 구성
          $cmakeArgs = @(
              "..",
              "-G", "${{ env.CMAKE_GENERATOR }}",
              "-DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}",
              "-DCMAKE_GENERATOR_PLATFORM=$($plat.Platform)",
              "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain",
              "-DVCPKG_TARGET_TRIPLET=$($plat.Triplet)",
              "-DBUILD_MODERN_AGENT=$($plat.Agent)",
              "-DBUILD_MODERN_MANAGER=$($plat.Manager)",
              "-DCMAKE_CXX_FLAGS=/MP /O2 /DNDEBUG",
              "-DCMAKE_EXE_LINKER_FLAGS=/OPT:REF /OPT:ICF",
              "-DCMAKE_SHARED_LINKER_FLAGS=/OPT:REF /OPT:ICF",
              "-DCMAKE_C_FLAGS=/MP /O2 /DNDEBUG"
          )

          & cmake @cmakeArgs

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configuration failed for $($plat.Name)" -ForegroundColor Red
            exit 1
          }

          # 병렬 빌드
          $parallelJobs = [math]::Min([int]"${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}", [int]$env:NUMBER_OF_PROCESSORS + 2)
          Write-Host "Building with $parallelJobs parallel jobs..." -ForegroundColor Gray

          $buildStart = Get-Date
          cmake --build . --config ${{ env.BUILD_TYPE }} --parallel $parallelJobs --verbose
          $buildEnd = Get-Date
          $buildTime = ($buildEnd - $buildStart).TotalSeconds

          $buildTimes[$plat.Name] = $buildTime
          Write-Host "$($plat.Name) build completed in $($buildTime.ToString("F1"))s" -ForegroundColor Green

          cd ..
        }

        $totalBuildEnd = Get-Date
        $totalBuildTime = ($totalBuildEnd - $totalBuildStart).TotalSeconds
        Write-Host "All platforms built in $($totalBuildTime.ToString("F1")) seconds" -ForegroundColor Green

        $buildTimesJson = $buildTimes | ConvertTo-Json
        echo "build-times=$buildTimesJson" >> $env:GITHUB_OUTPUT

    - name: Package platforms
      id: package-platforms
      run: |
        Write-Host "=== Creating Platform Packages ===" -ForegroundColor Green

        $platforms = @("x86", "x64", "ARM64")
        $totalSize = 0

        foreach ($platform in $platforms) {
          Write-Host "Creating $platform package..." -ForegroundColor Cyan

          $buildDir = "build-$platform"
          if (Test-Path $buildDir) {
            cd $buildDir

            # 파일 수집
            if ($platform -eq "x86") {
              $files = Get-ChildItem -Path "." -Include "*.dll" -Recurse
              $expectedAgent = "MacType.Core.dll"
            } else {
              $files = Get-ChildItem -Path "." -Include "*.exe", "*.dll" -Recurse
              $expectedAgent = "mt64agnt-$platform.exe"
            }

            if ($files.Count -gt 0) {
              # 에이전트 파일 검증 (x86 제외)
              if ($platform -ne "x86") {
                $agentFile = $files | Where-Object { $_.Name -eq $expectedAgent }
                if (-not $agentFile) {
                  Write-Host "Warning: Expected agent file '$expectedAgent' not found" -ForegroundColor Yellow
                } else {
                  Write-Host "Found expected agent: $expectedAgent" -ForegroundColor Green
                }
              }

              # 파일 정보 출력
              $platformSize = 0
              $files | Sort-Object Length -Descending | ForEach-Object {
                $sizeKB = [math]::Round($_.Length / 1KB, 2)
                $platformSize += $_.Length
                Write-Host "  $($_.Name) ($sizeKB KB)" -ForegroundColor Gray
              }

              $platformSizeMB = [math]::Round($platformSize / 1MB, 2)
              $totalSize += $platformSize
              Write-Host "$platform package size: $platformSizeMB MB" -ForegroundColor Cyan

              # 압축
              $compressionLevel = if ($platform -eq "x86") { "Fastest" } else { "${{ env.COMPRESSION_LEVEL }}" }
              Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-$platform-${{ env.BUILD_TYPE }}.zip" -CompressionLevel $compressionLevel

              Write-Host "$platform package created" -ForegroundColor Green
            } else {
              Write-Host "No $platform build files found!" -ForegroundColor Red
              exit 1
            }

            cd ..
          } else {
            Write-Host "$platform build directory not found!" -ForegroundColor Red
            exit 1
          }
        }

        $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
        echo "total-size=$totalSizeMB" >> $env:GITHUB_OUTPUT

        Write-Host "All platform packages created successfully" -ForegroundColor Green
        Write-Host "Total size: $totalSizeMB MB" -ForegroundColor Cyan

    - name: Upload all platform builds
      uses: actions/upload-artifact@v4
      with:
        name: MacType-All-Platforms-${{ env.BUILD_TYPE }}
        path: MacType-*-${{ env.BUILD_TYPE }}.zip
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: Create Release Packages
    runs-on: windows-latest
    needs: [build-manager, build-agents]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Organize release files
      run: |
        Write-Host "=== Organizing Release Files ===" -ForegroundColor Green

        # Create release directory
        mkdir release-files

        # Copy all artifacts to release directory
        Write-Host "Copying artifacts to release directory..." -ForegroundColor Cyan
        Copy-Item -Path "artifacts\*" -Destination "release-files\" -Recurse -Force

        Write-Host "Release files organized" -ForegroundColor Green

    - name: Create release packages
      run: |
        Write-Host "=== Creating Release Packages ===" -ForegroundColor Green

        # Create complete package
        Write-Host "Creating complete release package..." -ForegroundColor Cyan
        Compress-Archive -Path "release-files\*" -DestinationPath "MacType-Universal-Complete.zip" -CompressionLevel Optimal

        Write-Host "Release packages created successfully" -ForegroundColor Green

    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release-Packages
        path: MacType-*.zip
        retention-days: 60

  deploy-release:
    name: Deploy Release
    runs-on: windows-latest
    needs: create-release
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release-Packages
        path: release-assets

    - name: Verify release packages
      run: |
        Write-Host "=== Verifying Release Packages ===" -ForegroundColor Green

        $releaseFiles = Get-ChildItem -Path "release-assets" -Filter "*.zip"
        if ($releaseFiles.Count -eq 0) {
          Write-Host "ERROR: No release packages found!" -ForegroundColor Red
          exit 1
        }

        Write-Host "Found $($releaseFiles.Count) release packages:" -ForegroundColor Cyan
        $totalSize = 0
        foreach ($file in $releaseFiles) {
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          $totalSize += $file.Length
          Write-Host "  📦 $($file.Name) ($sizeMB MB)" -ForegroundColor Gray
        }

        $totalSizeGB = [math]::Round($totalSize / 1GB, 2)
        Write-Host "Total release size: $totalSizeGB GB" -ForegroundColor Green

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true

    - name: Deployment summary
      run: |
        Write-Host "=== Deployment Summary ===" -ForegroundColor Green
        Write-Host "✅ MacType Universal has been successfully deployed!" -ForegroundColor Green
        Write-Host "📦 Release packages uploaded to GitHub Releases" -ForegroundColor Cyan
        Write-Host "🎯 All platforms supported: x86, x64, ARM64" -ForegroundColor Cyan
        Write-Host "🛠️  Universal Manager + Platform-specific Agents" -ForegroundColor Cyan
