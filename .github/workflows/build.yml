name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Check code quality with MSVC analyzer
      run: |
        # Create a simple analysis using MSVC compiler warnings
        mkdir build-analysis
        cd build-analysis
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="/analyze /analyze:stacksize 16384 /analyze:max_paths 256"
        cmake --build . --config Debug -- /p:RunCodeAnalysis=true 2>&1 | tee msvc-analysis.log || true

    - name: Upload analysis results
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-results
        path: |
          build-analysis/msvc-analysis.log
        retention-days: 7

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 90
    needs: static-analysis

    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
        configuration: [Release, Debug]
        exclude:
          # ARM64는 Release만 빌드 (Debug는 너무 느림)
          - platform: ARM64
            configuration: Debug

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Install Windows App SDK
      run: |
        Write-Host "Installing Windows App SDK..." -ForegroundColor Green
        # Windows App SDK 설치 (winget 사용)
        winget install Microsoft.WindowsAppSDK --accept-package-agreements --accept-source-agreements --silent

        # 설치 확인 및 환경 설정
        Write-Host "Checking Windows App SDK installation..." -ForegroundColor Cyan

        # 일반적인 설치 경로들 확인
        $possiblePaths = @(
          "${env:ProgramFiles}\WindowsApps\Microsoft.WindowsAppSDK.1.4_*\",
          "${env:ProgramFiles}\WindowsApps\Microsoft.WindowsAppSDK.1.3_*\",
          "${env:ProgramFiles}\WindowsApps\Microsoft.WindowsAppSDK.1.2_*\",
          "${env:ProgramFiles(x86)}\Microsoft\WindowsApps\Microsoft.WindowsAppSDK.1.4_*\",
          "${env:ProgramFiles(x86)}\Microsoft\WindowsApps\Microsoft.WindowsAppSDK.1.3_*\",
          "${env:ProgramFiles(x86)}\Microsoft\WindowsApps\Microsoft.WindowsAppSDK.1.2_*\"
        )

        $foundSdk = $false
        foreach ($path in $possiblePaths) {
          if (Test-Path $path) {
            $actualPath = Resolve-Path $path
            Write-Host "Windows App SDK found at: $actualPath" -ForegroundColor Green
            $foundSdk = $true
            break
          }
        }

        if (-not $foundSdk) {
          Write-Host "Windows App SDK not found in expected locations, checking winget..." -ForegroundColor Yellow
          winget list Microsoft.WindowsAppSDK

          # winget이 설치한 경우, 기본 경로를 다시 확인
          $defaultPaths = @(
            "C:\Program Files\WindowsApps\Microsoft.WindowsAppSDK.1.4_*\",
            "C:\Program Files\WindowsApps\Microsoft.WindowsAppSDK.1.3_*\",
            "C:\Program Files (x86)\Microsoft\WindowsApps\Microsoft.WindowsAppSDK.1.4_*\",
            "C:\Program Files (x86)\Microsoft\WindowsApps\Microsoft.WindowsAppSDK.1.3_*\"
          )

          foreach ($path in $defaultPaths) {
            if (Test-Path $path) {
              $actualPath = Resolve-Path $path
              Write-Host "Windows App SDK found at: $actualPath" -ForegroundColor Green
              $foundSdk = $true
              break
            }
          }
        }

        if (-not $foundSdk) {
          Write-Host "Windows App SDK installation might have failed, continuing anyway..." -ForegroundColor Yellow
        }

    - name: Add Windows SDK to PATH and set compatible SDK version
      run: |
        echo "=== 설치된 Windows SDK 버전들 ==="
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name
        $sdkVersions | ForEach-Object { echo "  - $($_.Name)" }
        $preferredVersions = @("10.0.26100.0", "10.0.22621.0", "10.0.22000.0", "10.0.20348.0", "10.0.19041.0")
        $selectedSdk = $null
        foreach ($version in $preferredVersions) {
          $sdkIncludePath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$version"
          if (Test-Path $sdkIncludePath) { $selectedSdk = $version; echo "선택된 Windows SDK: $version"; break }
        }
        if (-not $selectedSdk -and $sdkVersions) {
          $newestSdk = $sdkVersions | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending | Select-Object -First 1
          if ($newestSdk) { $selectedSdk = $newestSdk.Name; echo "최신 Windows SDK 사용: $selectedSdk" } else { $selectedSdk = $sdkVersions[0].Name; echo "기본 Windows SDK 사용: $selectedSdk" }
        }
        if ($selectedSdk) {
          echo "WindowsSDKVersion=$selectedSdk" >> $env:GITHUB_ENV
          echo "WINDOWS_SDK_VERSION=$selectedSdk" >> $env:GITHUB_ENV
          # 플랫폼별 SDK bin 경로 설정
          $sdkBinPath = switch ("${{ matrix.platform }}") {
            "x86" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x86" }
            "x64" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64" }
            "ARM64" { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\arm64" }  # ARM64 네이티브 컴파일
            default { "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64" }
          }
          if (Test-Path $sdkBinPath) { echo "$sdkBinPath" >> $env:GITHUB_PATH }
        }
        echo "=== Visual Studio 설치 확인 ==="
        Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\" -ErrorAction SilentlyContinue

    # vcpkg 캐시 비활성화 - baseline 문제 해결을 위해

    - name: Setup vcpkg
      run: |
        if (Test-Path "vcpkg") { Remove-Item -Recurse -Force vcpkg }
        git clone https://github.com/Microsoft/vcpkg.git
        cd vcpkg
        if (!(Test-Path "vcpkg.exe")) { .\bootstrap-vcpkg.bat }
        echo "VCPKG_ROOT=$PWD" >> $env:GITHUB_ENV
        echo "$PWD" >> $env:GITHUB_PATH
        cd ..

    - name: Install detours and deps via vcpkg (manifest)
      run: |
        # 플랫폼별 triplet 설정
        $triplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        # vcpkg는 이미 Setup vcpkg 단계에서 설치됨

        # vcpkg로 의존성 설치 (매니페스트 모드)
        .\vcpkg\vcpkg.exe install --triplet $triplet

        # vcpkg 설치 확인 및 목록 출력
        Write-Host "vcpkg 의존성 설치 완료" -ForegroundColor Green
        .\vcpkg\vcpkg.exe list --triplet $triplet

    - name: Configure CMake
      run: |
        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build

        # vcpkg toolchain 경로 확인 및 설정
        $vcpkgToolchain = "$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake"
        if (!(Test-Path $vcpkgToolchain)) {
          Write-Host "vcpkg toolchain not found at: $vcpkgToolchain"
          Write-Host "Current directory: $PWD"
          Get-ChildItem -Path "$PWD/../vcpkg" -Recurse -Filter "vcpkg.cmake" | Select-Object FullName
          exit 1
        }

        Write-Host "Using vcpkg toolchain: $vcpkgToolchain"
        # 플랫폼별 CMake 설정
        $generatorPlatform = switch ("${{ matrix.platform }}") {
            "x64" { "x64" }
            "x86" { "Win32" }
            "ARM64" { "ARM64" }
            default { "x64" }
        }
        $vcpkgTriplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_GENERATOR_PLATFORM=$generatorPlatform -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" -DVCPKG_TARGET_TRIPLET=$vcpkgTriplet -DVCPKG_INSTALLED_DIR="$PWD/../vcpkg/installed" -DBUILD_MODERN_AGENT=ON

    - name: Build with CMake
      run: |
        cd build
        cmake --build . --config ${{ matrix.configuration }} --parallel

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mactype-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          build/**/*.dll
          build/**/*.exe
          build/**/*.pdb
          build/**/*.lib
        retention-days: 30

    - name: List build artifacts
      run: |
        Write-Host "Build artifacts:" -ForegroundColor Green
        Get-ChildItem -Path build -Recurse -Include *.exe, *.dll | ForEach-Object {
          Write-Host "  $($_.FullName) ($($_.Length) bytes)"
        }

  create-installer:
    name: Create Windows Installer
    runs-on: windows-latest
    needs: build
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Setup NSIS
      run: |
        choco install nsis -y

    - name: Build Windows installer
      run: |
        Write-Host "Windows installer 빌드 시작..." -ForegroundColor Green
        # Windows installer 스크립트 사용
        if (Test-Path "installer/mactype-universal.iss") {
          Write-Host "MacType Windows 인스톨러 빌드 중..." -ForegroundColor Cyan
          & "C:\Program Files (x86)\NSIS\makensis.exe" .\installer\mactype-universal.iss
        } else {
          Write-Host "인스톨러 스크립트 미발견, 건너뜀" -ForegroundColor Yellow
        }

    - name: Upload Windows installer
      uses: actions/upload-artifact@v4
      with:
        name: mactype-windows-installer
        path: |
          installer/Output/*.exe
          installer/Output/*.msi
        retention-days: 30

  release:
    name: Release
    runs-on: windows-latest
    needs: [build, create-installer]
    if: github.event_name == 'release'
    timeout-minutes: 30

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release archive
      run: |
        Write-Host "릴리즈 아카이브 생성 중..." -ForegroundColor Green
        Compress-Archive -Path artifacts/mactype-*-Release/* -DestinationPath MacType-Windows.zip

    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          MacType-Windows.zip
          artifacts/mactype-windows-installer/*.exe
        token: ${{ secrets.GITHUB_TOKEN }}
