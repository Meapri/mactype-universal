name: Build MacType

on:
  # main, directwrite, develop 브랜치 푸시 시 빌드
  push:
    branches: [ "main", "directwrite", "develop" ]
  # PR 검증은 main 대상에서만 수행하여 중복 방지
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build configuration
  BUILD_CONFIGURATION: Release
  SOLUTION_FILE_PATH: ./gdipp.sln

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      matrix:
        platform: [x64]
        # ARM64와 x86은 제외하고 x64만 빌드

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Add Windows SDK to PATH and set compatible SDK version
      run: |
        # 사용 가능한 Windows SDK 버전들 확인
        echo "=== 설치된 Windows SDK 버전들 ==="
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name
        $sdkVersions | ForEach-Object { echo "  - $($_.Name)" }
        
        # SDK 호환성 문제 해결됨: 최신 SDK 우선 사용 (성능 및 기능 개선)
        $preferredVersions = @("10.0.26100.0", "10.0.22621.0", "10.0.22000.0", "10.0.20348.0", "10.0.19041.0")
        $selectedSdk = $null
        
        foreach ($version in $preferredVersions) {
          $sdkIncludePath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$version"
          if (Test-Path $sdkIncludePath) {
            $selectedSdk = $version
            echo "선택된 Windows SDK: $version"
            break
          }
        }
        
        # 찾지 못했으면 가장 최신 사용 가능한 버전 사용 (호환성 문제 해결됨)
        if (-not $selectedSdk -and $sdkVersions) {
          # 버전 번호 기준으로 정렬하여 가장 최신 것 선택
          $newestSdk = $sdkVersions | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Sort-Object Name -Descending | Select-Object -First 1
          if ($newestSdk) {
            $selectedSdk = $newestSdk.Name
            echo "최신 Windows SDK 사용 (호환성 해결됨): $selectedSdk"
          } else {
            $selectedSdk = $sdkVersions[0].Name
            echo "기본 Windows SDK 사용: $selectedSdk"
          }
        }
        
        if ($selectedSdk) {
          # 환경 변수로 SDK 버전 강제 설정
          echo "WindowsSDKVersion=$selectedSdk" >> $env:GITHUB_ENV
          echo "WINDOWS_SDK_VERSION=$selectedSdk" >> $env:GITHUB_ENV
          
          # SDK 경로를 PATH에 추가
          $sdkBinPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64"
          if (Test-Path $sdkBinPath) {
            echo "$sdkBinPath" >> $env:GITHUB_PATH
          }
        }
        
        # Visual Studio 경로 확인
        echo "=== Visual Studio 설치 확인 ==="
        Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\" -ErrorAction SilentlyContinue

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          lib/
          deps/
        key: ${{ runner.os }}-deps-manual-${{ hashFiles('doc/glyph_to_bitmapex.diff') }}
        restore-keys: |
          ${{ runner.os }}-deps-manual-

    - name: Create directories
      run: |
        New-Item -ItemType Directory -Force -Path lib
        New-Item -ItemType Directory -Force -Path deps

    - name: Build dependencies (manual, patched freetype)
      shell: pwsh
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        New-Item -ItemType Directory -Force -Path lib | Out-Null
        New-Item -ItemType Directory -Force -Path deps | Out-Null

        $cfg = "${{ env.BUILD_CONFIGURATION }}"
        $platform = "${{ matrix.platform }}"
        $msbuildPlatform = if ($platform -eq "x64") { "x64" } else { "Win32" }

        # 1) FreeType (custom fork + patch)
        if (!(Test-Path "deps/freetype-$platform")) {
          git clone https://github.com/snowie2000/freetype.git "deps/freetype-$platform"
        }
        cd "deps/freetype-$platform"
        git reset --hard HEAD
        git clean -xfd
        git apply --whitespace=nowarn ../../doc/glyph_to_bitmapex.diff
        msbuild builds/windows/vc2010/freetype.sln -p:Configuration=$cfg -p:Platform=$msbuildPlatform -p:WindowsTargetPlatformVersion=${{ env.WINDOWS_SDK_VERSION }} -p:PlatformToolset=v143 -v:minimal
        if ($platform -eq "x64") {
          Copy-Item "objs/x64/$cfg/freetype.lib" "../../lib/freetype64.lib" -Force
        } else {
          Copy-Item "objs/Win32/$cfg/freetype.lib" "../../lib/freetype.lib" -Force
        }
        cd ../..
        # FREETYPE_PATH -> repo 루트 (include 폴더 존재)
        echo "FREETYPE_PATH=$PWD/deps/freetype-$platform" >> $env:GITHUB_ENV

        # 2) IniParser (native lib)
        if (!(Test-Path "deps/iniparser")) {
          git clone https://github.com/snowie2000/IniParser.git deps/iniparser
        }
        cd deps/iniparser
        msbuild src/IniParser.sln -p:Configuration=$cfg -p:Platform=$msbuildPlatform -v:minimal
        if ($platform -eq "x64") {
          Copy-Item "src/IniParser/bin/x64/$cfg/iniparser.lib" "../../lib/iniparser64.lib" -Force
        } else {
          Copy-Item "src/IniParser/bin/x86/$cfg/iniparser.lib" "../../lib/iniparser.lib" -Force
        }
        cd ../..

        # 헤더: ndevilla/iniparser에서 iniparser.h/dictionary.h 확보
        if (!(Test-Path "deps/iniparser-headers")) {
          git clone https://github.com/ndevilla/iniparser.git deps/iniparser-headers
        }
        New-Item -ItemType Directory -Force -Path deps/include | Out-Null
        Copy-Item "deps/iniparser-headers/iniparser.h" "deps/include/" -Force
        Copy-Item "deps/iniparser-headers/dictionary.h" "deps/include/" -Force
        echo "INI_PARSER_PATH=$PWD/deps/include" >> $env:GITHUB_ENV

        # 3) Detours
        if (!(Test-Path "deps/detours")) {
          git clone https://github.com/microsoft/Detours.git deps/detours
          cd deps/detours
          nmake
          cd ../..
        }
        if (Test-Path "deps/detours/lib.X64/detours.lib") {
          Copy-Item "deps/detours/lib.X64/detours.lib" "lib/detours64.lib" -Force
        }

    - name: Diagnostic: show env and deps
      shell: pwsh
      run: |
        echo "FREETYPE_PATH=$env:FREETYPE_PATH"
        echo "INI_PARSER_PATH=$env:INI_PARSER_PATH"
        echo "Lib contents:"
        Get-ChildItem lib -Recurse | Select-Object FullName,Length
        echo "Deps include:"; Get-ChildItem deps/include -ErrorAction SilentlyContinue

    - name: Build MacType
      run: |
        # Set platform for MSBuild
        $msbuildPlatform = switch ("${{ matrix.platform }}") {
          "x86" { "Win32" }
          "x64" { "x64" }
          "ARM64" { "ARM64" }
          default { "x64" }
        }
        
        # 호환 가능한 Windows SDK 버전으로 빌드
        $sdkVersion = $env:WINDOWS_SDK_VERSION
        if (-not $sdkVersion) {
          $sdkVersion = "10.0.26100.0"  # 최신 SDK 사용 (호환성 문제 해결됨)
        }
        
        echo "사용할 Windows SDK 버전: $sdkVersion"
        
  # Build the solution with specific SDK version
  msbuild ${{ env.SOLUTION_FILE_PATH }} -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:Platform=$msbuildPlatform -p:WindowsTargetPlatformVersion=$sdkVersion -p:UseMultiToolTask=true -p:EnforceProcessCountAcrossBuilds=true -v:minimal

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mactype-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
        retention-days: 30

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: mactype-release-${{ matrix.platform }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
