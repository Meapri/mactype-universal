name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]

env:
  # Build configuration
  BUILD_CONFIGURATION: Release
  SOLUTION_FILE_PATH: ./gdipp.sln

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x86, x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Add Windows SDK to PATH and set compatible SDK version
      run: |
        # 사용 가능한 Windows SDK 버전들 확인
        echo "=== 설치된 Windows SDK 버전들 ==="
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue | Sort-Object Name
        $sdkVersions | ForEach-Object { echo "  - $($_.Name)" }
        
        # MacType 호환성을 위해 가장 오래된 SDK 버전 우선 선택
        $preferredVersions = @("10.0.17763.0", "10.0.18362.0", "10.0.19041.0", "10.0.20348.0", "10.0.22000.0")
        $selectedSdk = $null
        
        foreach ($version in $preferredVersions) {
          $sdkIncludePath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\$version"
          if (Test-Path $sdkIncludePath) {
            $selectedSdk = $version
            echo "선택된 Windows SDK: $version"
            break
          }
        }
        
        # 찾지 못했으면 가장 오래된 사용 가능한 버전 사용 (MacType 호환성을 위해)
        if (-not $selectedSdk -and $sdkVersions) {
          # 버전 번호 기준으로 정렬하여 가장 오래된 것 선택
          $oldestSdk = $sdkVersions | Where-Object { $_.Name -match "^\d+\.\d+\.\d+\.\d+$" } | Sort-Object Name | Select-Object -First 1
          if ($oldestSdk) {
            $selectedSdk = $oldestSdk.Name
            echo "MacType 호환성을 위해 가장 오래된 SDK 사용: $selectedSdk"
          } else {
            $selectedSdk = $sdkVersions[0].Name
            echo "기본 Windows SDK 사용: $selectedSdk"
          }
        }
        
        if ($selectedSdk) {
          # 환경 변수로 SDK 버전 강제 설정
          echo "WindowsSDKVersion=$selectedSdk" >> $env:GITHUB_ENV
          echo "WINDOWS_SDK_VERSION=$selectedSdk" >> $env:GITHUB_ENV
          
          # SDK 경로를 PATH에 추가
          $sdkBinPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$selectedSdk\x64"
          if (Test-Path $sdkBinPath) {
            echo "$sdkBinPath" >> $env:GITHUB_PATH
          }
        }
        
        # Visual Studio 경로 확인
        echo "=== Visual Studio 설치 확인 ==="
        Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\" -ErrorAction SilentlyContinue
        Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\" -ErrorAction SilentlyContinue

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          lib/
          deps/
        key: ${{ runner.os }}-deps-${{ hashFiles('**/HOWTOBUILD.md') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Create directories
      run: |
        New-Item -ItemType Directory -Force -Path lib
        New-Item -ItemType Directory -Force -Path deps

    - name: Build dependencies
      run: |
        # 빌드 스크립트 실행 권한 설정
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        
        # 종속성 빌드
        .\scripts\build-dependencies.ps1 -Platform ${{ matrix.platform }} -Configuration ${{ env.BUILD_CONFIGURATION }}
        
        # 환경 변수 설정 (스크립트에서 자동 설정되지만 GitHub Actions용으로 추가)
        echo "FREETYPE_PATH=$PWD/deps/freetype-${{ matrix.platform }}" >> $env:GITHUB_ENV
        echo "INI_PARSER_PATH=$PWD/deps/iniparser" >> $env:GITHUB_ENV

    - name: Build MacType
      run: |
        # Set platform for MSBuild
        $msbuildPlatform = if ("${{ matrix.platform }}" -eq "x86") { "Win32" } else { "x64" }
        
        # 호환 가능한 Windows SDK 버전으로 빌드
        $sdkVersion = $env:WINDOWS_SDK_VERSION
        if (-not $sdkVersion) {
          $sdkVersion = "10.0.20348.0"  # MacType 호환성을 위한 더 오래된 기본값
        }
        
        echo "사용할 Windows SDK 버전: $sdkVersion"
        
        # Build the solution with specific SDK version
        msbuild ${{ env.SOLUTION_FILE_PATH }} -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:Platform=$msbuildPlatform -p:WindowsTargetPlatformVersion=$sdkVersion -p:UseMultiToolTask=true -p:EnforceProcessCountAcrossBuilds=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mactype-${{ matrix.platform }}-${{ env.BUILD_CONFIGURATION }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
        retention-days: 30

    - name: Upload release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: mactype-release-${{ matrix.platform }}
        path: |
          ${{ env.BUILD_CONFIGURATION }}/
          **/*.dll
          **/*.exe
