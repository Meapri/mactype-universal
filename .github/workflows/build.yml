name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'

jobs:
  # 공통 환경 설정 및 의존성 설치
  setup-environment:
    name: Setup Environment
    runs-on: windows-latest
    timeout-minutes: 15
    outputs:
      vcpkg-root: ${{ steps.setup-vcpkg.outputs.vcpkg-root }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Verify Windows Environment
      run: |
        Write-Host "=== Windows Environment Verification ===" -ForegroundColor Green
        Write-Host "Available CPU cores: $env:NUMBER_OF_PROCESSORS" -ForegroundColor Cyan

        # Windows SDK 버전 확인
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue
        if ($sdkVersions) {
          $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Windows SDK: $($latestSdk.Name)" -ForegroundColor Green
        } else {
          Write-Host "Windows SDK: Not found" -ForegroundColor Yellow
        }

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      id: setup-vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          Write-Host "Cloning vcpkg..." -ForegroundColor Cyan
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          Write-Host "Using cached vcpkg..." -ForegroundColor Cyan
          cd vcpkg
        }
        $vcpkgRoot = $PWD
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH
        echo "vcpkg-root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
        cd ..
        Write-Host "vcpkg ready at: $vcpkgRoot" -ForegroundColor Green

    - name: Pre-install common dependencies
      run: |
        Write-Host "Pre-installing common dependencies..." -ForegroundColor Cyan
        # x64 및 ARM64에 공통으로 필요한 의존성들 미리 설치
        .\vcpkg\vcpkg.exe install --triplet x64-windows --binarycaching
        Write-Host "Common dependencies ready" -ForegroundColor Green

  # Universal Manager 빌드 (x64 + ARM64)
  build-manager:
    name: Build MacType Manager (Universal)
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        echo "VCPKG_ROOT=${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_ENV
        echo "${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_PATH

    - name: Configure and Build Universal Manager
      run: |
        Write-Host "=== Building Universal MacType Manager ===" -ForegroundColor Green

        if (Test-Path "build-manager") {
          Remove-Item -Recurse -Force build-manager
        }
        mkdir build-manager
        cd build-manager

        # Universal Windows App 구성 (단순화)
        Write-Host "Configuring Universal App..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_GENERATOR_PLATFORM=x64 `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DBUILD_MODERN_MANAGER=ON `
          -DCMAKE_CXX_FLAGS="/MP /O2" `
          -DCMAKE_SYSTEM_NAME=WindowsStore `
          -DCMAKE_SYSTEM_VERSION=10.0

        # 병렬 빌드
        Write-Host "Building Universal Manager..." -ForegroundColor Cyan
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create Universal Manager Package
      run: |
        Write-Host "Creating Universal Manager package..." -ForegroundColor Cyan
        cd build-manager

        # 실행 파일 확인 및 패키징
        $exeFiles = Get-ChildItem -Path "." -Filter "*.exe" -Recurse
        if ($exeFiles.Count -gt 0) {
          Write-Host "Found executable files:" -ForegroundColor Green
          $exeFiles | ForEach-Object {
            Write-Host "  $($_.FullName)" -ForegroundColor Gray
          }

          # ZIP 패키지 생성
          Compress-Archive -Path "*.exe", "*.dll", "*.pri", "*.appx" -DestinationPath "../MacTypeManager-Universal.zip" -CompressionLevel Optimal
          Write-Host "Universal Manager package created" -ForegroundColor Green
        } else {
          Write-Host "No executable files found!" -ForegroundColor Red
          exit 1
        }

    - name: Upload Universal Manager
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: |
          MacTypeManager-Universal.zip
          build-manager/*.exe
          build-manager/*.dll
        retention-days: 30
        if-no-files-found: error

  # 플랫폼별 Agent 빌드 (x64, ARM64만)
  build-agents:
    name: Build Agents ${{ matrix.platform }}
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]  # x86 제외 (이전 결정에 따라)
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        echo "VCPKG_ROOT=${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_ENV
        echo "${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_PATH

    - name: Install platform-specific dependencies
      run: |
        $triplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        Write-Host "Installing dependencies for ${{ matrix.platform }} ($triplet)..." -ForegroundColor Cyan
        .\vcpkg\vcpkg.exe install --triplet $triplet --binarycaching --only-downloads

    - name: Configure and Build Agent
      run: |
        Write-Host "=== Building MacType Agent for ${{ matrix.platform }} ===" -ForegroundColor Green

        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build

        # 플랫폼별 설정 (단순화)
        $generatorPlatform = switch ("${{ matrix.platform }}") {
            "x64" { "x64" }
            "ARM64" { "ARM64" }
            default { "x64" }
        }
        $vcpkgTriplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        # CMake 구성
        Write-Host "Configuring for $generatorPlatform..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} `
          -DCMAKE_GENERATOR_PLATFORM=$generatorPlatform `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=$vcpkgTriplet `
          -DBUILD_MODERN_AGENT=ON `
          -DCMAKE_CXX_FLAGS="/MP /O2"

        # 병렬 빌드
        Write-Host "Building Agent..." -ForegroundColor Cyan
        cmake --build . --config ${{ matrix.configuration }} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create Agent Package
      run: |
        Write-Host "Creating Agent package..." -ForegroundColor Cyan
        cd build

        $files = Get-ChildItem -Path "." -Include "*.exe", "*.dll" -Recurse
        if ($files.Count -gt 0) {
          Write-Host "Found build files:" -ForegroundColor Green
          $files | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1KB, 2)) KB)" -ForegroundColor Gray
          }

          # 압축 패키지 생성
          Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip" -CompressionLevel Optimal
          Write-Host "Agent package created" -ForegroundColor Green
        } else {
          Write-Host "No build files found!" -ForegroundColor Red
          exit 1
        }

    - name: Upload Agent Build
      uses: actions/upload-artifact@v4
      with:
        name: MacType-${{ matrix.platform }}-${{ matrix.configuration }}
        path: MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip
        retention-days: 30
        if-no-files-found: error

  # 릴리스 패키지 생성 및 배포
  create-release:
    name: Create Release Packages
    runs-on: windows-latest
    needs: [build-manager, build-agents]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Organize and package release files
      run: |
        Write-Host "=== Creating Release Packages ===" -ForegroundColor Green
        mkdir release-files

        # Universal Manager 추출
        Write-Host "Extracting Universal Manager..." -ForegroundColor Cyan
        if (Test-Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip") {
          Expand-Archive -Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip" -DestinationPath "release-files/Manager"
          Write-Host "Manager extracted" -ForegroundColor Green
        }

        # 플랫폼별 Agent 추출
        Write-Host "Extracting platform agents..." -ForegroundColor Cyan
        $agentArchives = Get-ChildItem -Path artifacts -Filter "MacType-*-Release.zip"
        foreach ($archive in $agentArchives) {
          $platform = $archive.Name -replace "MacType-(.+)-Release\.zip", '$1'
          mkdir "release-files/Agents/$platform"
          Expand-Archive -Path $archive.FullName -DestinationPath "release-files/Agents/$platform"
          Write-Host "Agent $platform extracted" -ForegroundColor Green
        }

    - name: Create release packages
      run: |
        Write-Host "Creating release packages..." -ForegroundColor Cyan

        # 전체 패키지
        Compress-Archive -Path release-files/* -DestinationPath MacType-Universal-Complete.zip -CompressionLevel Optimal

        # 개별 패키지들
        if (Test-Path "release-files/Manager") {
          Compress-Archive -Path release-files/Manager/* -DestinationPath MacType-Manager-Universal.zip -CompressionLevel Optimal
        }
        if (Test-Path "release-files/Agents") {
          Compress-Archive -Path release-files/Agents/* -DestinationPath MacType-Agents-Universal.zip -CompressionLevel Optimal
        }

        # 패키지 정보 출력
        Write-Host "Release packages created:" -ForegroundColor Green
        Get-ChildItem -Filter "MacType-*.zip" | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  $($_.Name) ($size MB)" -ForegroundColor Gray
        }

    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release-Packages
        path: MacType-*.zip
        retention-days: 60

  deploy-release:
    name: Deploy Release
    runs-on: windows-latest
    needs: create-release
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release-Packages
        path: release-assets

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
