name: Build MacType

on:
  push:
    branches: [ "main", "directwrite", "develop" ]
  pull_request:
    branches: [ "main", "directwrite" ]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
  BUILD_TYPE: Release
  COMPRESSION_LEVEL: Optimal
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 16

jobs:
  # 공통 환경 설정 및 의존성 설치
  setup-environment:
    name: Setup Environment
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      vcpkg-root: ${{ steps.setup-vcpkg.outputs.vcpkg-root }}
      setup-time: ${{ steps.setup-complete.outputs.setup-time }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@master

    - name: Setup Windows Development Environment
      run: |
        Write-Host "=== Setting up Windows Development Environment ===" -ForegroundColor Green

        # Function to check and install Windows App SDK
        function Install-WindowsAppSDK {
          param([string]$SdkUrl)

          $installerPath = "$env:TEMP\WindowsAppRuntimeInstall.exe"

          try {
            Write-Host "Downloading Windows App Runtime..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri $SdkUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 300

            Write-Host "Installing Windows App Runtime..." -ForegroundColor Cyan
            $installProcess = Start-Process -FilePath $installerPath -ArgumentList "/silent", "/norestart" -Wait -NoNewWindow -PassThru

            if ($installProcess.ExitCode -eq 0) {
              Write-Host "Windows App SDK installed successfully" -ForegroundColor Green
              return $true
            } else {
              Write-Host "Windows App SDK installation failed with exit code: $($installProcess.ExitCode)" -ForegroundColor Red
              return $false
            }
          }
          catch {
            Write-Host "Windows App SDK installation error: $($_.Exception.Message)" -ForegroundColor Red
            return $false
          }
          finally {
            if (Test-Path $installerPath) {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
            }
          }
        }

        # Check Windows SDK and install Windows App SDK if needed
        $sdkFound = $false
        $sdkPaths = @(
          "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe",
          "${env:ProgramFiles}\Microsoft SDKs\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe",
          "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\makeappx.exe"
        )

        foreach ($path in $sdkPaths) {
          if (Test-Path $path) {
            Write-Host "Windows SDK found: $path" -ForegroundColor Green
            $sdkFound = $true
            break
          }
        }

        if (-not $sdkFound) {
          Write-Host "Windows SDK not found, installing Windows App Runtime..." -ForegroundColor Yellow
          $sdkUrl = "https://aka.ms/windowsappsdk/1.4/latest/windowsappruntimeinstall-x64.exe"
          $installSuccess = Install-WindowsAppSDK -SdkUrl $sdkUrl

          if (-not $installSuccess) {
            Write-Host "Warning: Windows App SDK installation failed, but continuing build..." -ForegroundColor Yellow
          }
        } else {
          Write-Host "Windows development environment is ready" -ForegroundColor Green
        }

    - name: Verify Windows Environment
      run: |
        Write-Host "=== Windows Environment Verification ===" -ForegroundColor Green
        Write-Host "Available CPU cores: $env:NUMBER_OF_PROCESSORS" -ForegroundColor Cyan

        # Windows SDK 버전 확인
        $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\" -Directory -ErrorAction SilentlyContinue
        if ($sdkVersions) {
          $latestSdk = $sdkVersions | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "Windows SDK: $($latestSdk.Name)" -ForegroundColor Green
        } else {
          Write-Host "Windows SDK: Not found" -ForegroundColor Yellow
        }

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          vcpkg
          vcpkg/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-
          vcpkg-

    - name: Setup vcpkg
      id: setup-vcpkg
      run: |
        if (!(Test-Path "vcpkg")) {
          Write-Host "Cloning vcpkg..." -ForegroundColor Cyan
          git clone https://github.com/Microsoft/vcpkg.git --depth 1
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        } else {
          Write-Host "Using cached vcpkg..." -ForegroundColor Cyan
          cd vcpkg
        }
        $vcpkgRoot = $PWD
        echo "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        echo "$vcpkgRoot" >> $env:GITHUB_PATH
        echo "vcpkg-root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
        cd ..
        Write-Host "vcpkg ready at: $vcpkgRoot" -ForegroundColor Green

    - name: Optimize vcpkg for performance
      run: |
        Write-Host "=== Optimizing vcpkg for performance ===" -ForegroundColor Green

        # Configure vcpkg for better performance
        Write-Host "Configuring vcpkg settings..." -ForegroundColor Cyan
        $vcpkgRoot = $PWD
        cd vcpkg

        # Enable binary caching and parallel downloads
        .\vcpkg.exe integrate install --dry-run | Out-Null

        # Pre-download common packages to reduce build time
        Write-Host "Pre-downloading common dependencies..." -ForegroundColor Cyan
        .\vcpkg.exe install --triplet x64-windows --only-downloads --binarycaching

        cd $vcpkgRoot
        Write-Host "vcpkg optimization complete" -ForegroundColor Green

    - name: Complete setup
      id: setup-complete
      run: |
        $setupTime = (Get-Date).ToString("o")
        echo "setup-time=$setupTime" >> $env:GITHUB_OUTPUT
        Write-Host "Environment setup completed at $setupTime" -ForegroundColor Green

  # Universal Manager 빌드 (x64 + ARM64)
  build-manager:
    name: Build MacType Manager (Universal)
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        echo "VCPKG_ROOT=${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_ENV
        echo "${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_PATH

    - name: Configure and Build Universal Manager
      run: |
        Write-Host "=== Building Universal MacType Manager ===" -ForegroundColor Green

        if (Test-Path "build-manager") {
          Remove-Item -Recurse -Force build-manager
        }
        mkdir build-manager
        cd build-manager

        # Universal Windows App 구성 (단순화)
        Write-Host "Configuring Universal App..." -ForegroundColor Cyan
        cmake .. `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_GENERATOR_PLATFORM=x64 `
          -DCMAKE_TOOLCHAIN_FILE="$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -DBUILD_MODERN_MANAGER=ON `
          -DCMAKE_CXX_FLAGS="/MP /O2" `
          -DCMAKE_SYSTEM_NAME=WindowsStore `
          -DCMAKE_SYSTEM_VERSION=10.0

        # 병렬 빌드
        Write-Host "Building Universal Manager..." -ForegroundColor Cyan
        cmake --build . --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Create Universal Manager Package
      run: |
        Write-Host "Creating Universal Manager package..." -ForegroundColor Cyan
        cd build-manager

        # 실행 파일 확인 및 패키징
        $exeFiles = Get-ChildItem -Path "." -Filter "*.exe" -Recurse
        if ($exeFiles.Count -gt 0) {
          Write-Host "Found executable files:" -ForegroundColor Green
          $exeFiles | ForEach-Object {
            Write-Host "  $($_.FullName)" -ForegroundColor Gray
          }

          # ZIP 패키지 생성
          Compress-Archive -Path "*.exe", "*.dll", "*.pri", "*.appx" -DestinationPath "../MacTypeManager-Universal.zip" -CompressionLevel Optimal
          Write-Host "Universal Manager package created" -ForegroundColor Green
        } else {
          Write-Host "No executable files found!" -ForegroundColor Red
          exit 1
        }

    - name: Upload Universal Manager
      uses: actions/upload-artifact@v4
      with:
        name: MacTypeManager-Universal
        path: |
          MacTypeManager-Universal.zip
          build-manager/*.exe
          build-manager/*.dll
        retention-days: 30
        if-no-files-found: error

  # 플랫폼별 빌드 (x86 코어 DLL + x64/ARM64 Agents)
  build-platforms:
    name: Build ${{ matrix.platform }} (${{ matrix.type }})
    runs-on: windows-latest
    needs: setup-environment
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            type: "Core DLL only"
            build_agent: "OFF"
          - platform: x64
            type: "Agent + Core"
            build_agent: "ON"
          - platform: ARM64
            type: "Agent + Core"
            build_agent: "ON"
        configuration: [Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Restore environment
      run: |
        Write-Host "Restoring build environment..." -ForegroundColor Cyan
        echo "VCPKG_ROOT=${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_ENV
        echo "${{ needs.setup-environment.outputs.vcpkg-root }}" >> $env:GITHUB_PATH

    - name: Install platform-specific dependencies
      run: |
        $triplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        Write-Host "Installing dependencies for ${{ matrix.platform }} ($triplet)..." -ForegroundColor Cyan

        # Use optimized installation with parallel processing
        $installArgs = @(
            "install",
            "--triplet", $triplet,
            "--binarycaching",
            "--downloads-root", "$PWD\vcpkg-downloads",
            "--x-buildtrees-root", "$PWD\vcpkg-buildtrees",
            "--x-install-root", "$PWD\vcpkg-installed",
            "--x-packages-root", "$PWD\vcpkg-packages"
        )

        # For x86, we only need core dependencies, not full installation
        if ("${{ matrix.platform }}" -eq "x86") {
            $installArgs += "--only-downloads"
        }

        & ".\vcpkg\vcpkg.exe" @installArgs

        Write-Host "Dependencies for ${{ matrix.platform }} installed successfully" -ForegroundColor Green

    - name: Configure and Build Platform
      run: |
        Write-Host "=== Building MacType ${{ matrix.type }} for ${{ matrix.platform }} ===" -ForegroundColor Green

        if (Test-Path "build") {
          Remove-Item -Recurse -Force build
        }
        mkdir build
        cd build

        # 플랫폼별 설정
        $generatorPlatform = switch ("${{ matrix.platform }}") {
            "x64" { "x64" }
            "x86" { "Win32" }
            "ARM64" { "ARM64" }
            default { "x64" }
        }
        $vcpkgTriplet = switch ("${{ matrix.platform }}") {
            "x64" { "x64-windows" }
            "x86" { "x86-windows" }
            "ARM64" { "arm64-windows" }
            default { "x64-windows" }
        }

        # CMake 구성 (최적화된 설정)
        Write-Host "Configuring ${{ matrix.platform }} ($generatorPlatform)..." -ForegroundColor Cyan

        $cmakeArgs = @(
            "..",
            "-G", $env:CMAKE_GENERATOR,
            "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE",
            "-DCMAKE_GENERATOR_PLATFORM=$generatorPlatform",
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/../vcpkg/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=$vcpkgTriplet",
            "-DBUILD_MODERN_AGENT=${{ matrix.build_agent }}",
            "-DCMAKE_CXX_FLAGS=/MP /O2 /DNDEBUG",
            "-DCMAKE_EXE_LINKER_FLAGS=/OPT:REF /OPT:ICF",
            "-DCMAKE_SHARED_LINKER_FLAGS=/OPT:REF /OPT:ICF",
            "-DCMAKE_C_FLAGS=/MP /O2 /DNDEBUG"
        )

        & cmake @cmakeArgs

        # 병렬 빌드 (환경 변수로 최적화)
        $parallelJobs = [math]::Min([int]$env:CMAKE_BUILD_PARALLEL_LEVEL, [int]$env:NUMBER_OF_PROCESSORS + 2)
        Write-Host "Building ${{ matrix.type }} with $parallelJobs parallel jobs..." -ForegroundColor Cyan

        $buildStart = Get-Date
        cmake --build . --config $env:BUILD_TYPE --parallel $parallelJobs --verbose
        $buildEnd = Get-Date
        $buildTime = $buildEnd - $buildStart

        Write-Host "Build completed in $($buildTime.TotalSeconds.ToString("F1")) seconds" -ForegroundColor Green

    - name: Create Platform Package
      run: |
        Write-Host "Creating ${{ matrix.platform }} package..." -ForegroundColor Cyan
        cd build

        # 빌드 결과 검증 및 분석
        $exeFiles = Get-ChildItem -Path "." -Include "*.exe" -Recurse -ErrorAction SilentlyContinue
        $dllFiles = Get-ChildItem -Path "." -Include "*.dll" -Recurse -ErrorAction SilentlyContinue
        $allFiles = @($exeFiles) + @($dllFiles)

        if ($allFiles.Count -gt 0) {
          Write-Host "Build artifacts found:" -ForegroundColor Green

          # 파일별 정보 출력
          $totalSize = 0
          $allFiles | Sort-Object Length -Descending | ForEach-Object {
            $sizeKB = [math]::Round($_.Length / 1KB, 2)
            $totalSize += $_.Length
            Write-Host "  $($_.Name) ($sizeKB KB)" -ForegroundColor Gray
          }

          $totalSizeMB = [math]::Round($totalSize / 1MB, 2)
          Write-Host "Total package size: $totalSizeMB MB" -ForegroundColor Cyan

          # 플랫폼별 최적화된 압축 (환경 변수 사용)
          $compressionLevel = if ("${{ matrix.platform }}" -eq "x86") { "Fastest" } else { $env:COMPRESSION_LEVEL }
          Write-Host "Creating ZIP archive with $compressionLevel compression..." -ForegroundColor Cyan

          $zipStart = Get-Date
          Compress-Archive -Path "*.exe", "*.dll" -DestinationPath "../MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip" -CompressionLevel $compressionLevel
          $zipEnd = Get-Date
          $zipTime = $zipEnd - $zipStart

          Write-Host "Package created in $($zipTime.TotalSeconds.ToString("F1")) seconds" -ForegroundColor Green
        } else {
          Write-Host "ERROR: No build artifacts found in build directory!" -ForegroundColor Red
          Write-Host "Build directory contents:" -ForegroundColor Yellow
          Get-ChildItem -Path "." -Recurse | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, Length | Format-Table -AutoSize
          exit 1
        }

    - name: Upload Agent Build
      uses: actions/upload-artifact@v4
      with:
        name: MacType-${{ matrix.platform }}-${{ matrix.configuration }}
        path: MacType-${{ matrix.platform }}-${{ matrix.configuration }}.zip
        retention-days: 30
        if-no-files-found: error

  # 릴리스 패키지 생성 및 배포
  create-release:
    name: Create Release Packages
    runs-on: windows-latest
    needs: [build-manager, build-platforms]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Organize and package release files
      run: |
        Write-Host "=== Creating Release Packages ===" -ForegroundColor Green
        mkdir release-files

        # Universal Manager 추출
        Write-Host "Extracting Universal Manager..." -ForegroundColor Cyan
        if (Test-Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip") {
          Expand-Archive -Path "artifacts/MacTypeManager-Universal/MacTypeManager-Universal.zip" -DestinationPath "release-files/Manager"
          Write-Host "Manager extracted" -ForegroundColor Green
        }

        # 플랫폼별 Agent 추출
        Write-Host "Extracting platform agents..." -ForegroundColor Cyan
        $agentArchives = Get-ChildItem -Path artifacts -Filter "MacType-*-Release.zip"
        foreach ($archive in $agentArchives) {
          $platform = $archive.Name -replace "MacType-(.+)-Release\.zip", '$1'
          mkdir "release-files/Agents/$platform"
          Expand-Archive -Path $archive.FullName -DestinationPath "release-files/Agents/$platform"
          Write-Host "Agent $platform extracted" -ForegroundColor Green
        }

    - name: Create release packages
      run: |
        Write-Host "=== Creating Optimized Release Packages ===" -ForegroundColor Green

        $packageStart = Get-Date

        # Function to create optimized package
        function New-OptimizedPackage {
          param([string]$Path, [string]$Destination, [string]$Description)

          if (Test-Path $Path) {
            Write-Host "Creating $Description package..." -ForegroundColor Cyan

            $files = Get-ChildItem -Path $Path -Recurse -File
            if ($files.Count -gt 0) {
              $totalSize = ($files | Measure-Object -Property Length -Sum).Sum
              $sizeMB = [math]::Round($totalSize / 1MB, 2)
              Write-Host "  Source files: $($files.Count), Total size: $sizeMB MB" -ForegroundColor Gray

              $zipStart = Get-Date
              Compress-Archive -Path $Path -DestinationPath $Destination -CompressionLevel $env:COMPRESSION_LEVEL
              $zipEnd = Get-Date

              $zipTime = ($zipEnd - $zipStart).TotalSeconds
              $finalSize = [math]::Round((Get-Item $Destination).Length / 1MB, 2)
              $ratio = [math]::Round(($totalSize - (Get-Item $Destination).Length) / $totalSize * 100, 1)

              Write-Host "  Package created: $finalSize MB ($ratio% compressed) in $($zipTime.ToString("F1"))s" -ForegroundColor Green
            } else {
              Write-Host "  Warning: No files found in $Path" -ForegroundColor Yellow
            }
          } else {
            Write-Host "  Warning: Path $Path not found, skipping $Description package" -ForegroundColor Yellow
          }
        }

        # 병렬 패키지 생성 (PowerShell 7+에서만 가능)
        $jobs = @()

        # 전체 패키지
        New-OptimizedPackage -Path "release-files" -Destination "MacType-Universal-Complete.zip" -Description "complete"

        # 개별 패키지들
        New-OptimizedPackage -Path "release-files/Manager" -Destination "MacType-Manager-Universal.zip" -Description "manager"
        New-OptimizedPackage -Path "release-files/Agents" -Destination "MacType-Agents-Universal.zip" -Description "agents"

        $packageEnd = Get-Date
        $packageTime = $packageEnd - $packageStart

        # 최종 결과 출력
        Write-Host "Release packages created successfully:" -ForegroundColor Green
        Get-ChildItem -Filter "MacType-*.zip" | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  📦 $($_.Name) ($size MB)" -ForegroundColor Cyan
        }

        Write-Host "Total packaging time: $($packageTime.TotalSeconds.ToString("F1")) seconds" -ForegroundColor Green

    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: MacType-Release-Packages
        path: MacType-*.zip
        retention-days: 60

  deploy-release:
    name: Deploy Release
    runs-on: windows-latest
    needs: create-release
    if: github.event_name == 'release'
    timeout-minutes: 10

    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        name: MacType-Release-Packages
        path: release-assets

    - name: Verify release packages
      run: |
        Write-Host "=== Verifying Release Packages ===" -ForegroundColor Green

        $releaseFiles = Get-ChildItem -Path "release-assets" -Filter "*.zip"
        if ($releaseFiles.Count -eq 0) {
          Write-Host "ERROR: No release packages found!" -ForegroundColor Red
          exit 1
        }

        Write-Host "Found $($releaseFiles.Count) release packages:" -ForegroundColor Cyan
        $totalSize = 0
        foreach ($file in $releaseFiles) {
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          $totalSize += $file.Length
          Write-Host "  📦 $($file.Name) ($sizeMB MB)" -ForegroundColor Gray
        }

        $totalSizeGB = [math]::Round($totalSize / 1GB, 2)
        Write-Host "Total release size: $totalSizeGB GB" -ForegroundColor Green

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-assets/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true

    - name: Deployment summary
      run: |
        Write-Host "=== Deployment Summary ===" -ForegroundColor Green
        Write-Host "✅ MacType Universal has been successfully deployed!" -ForegroundColor Green
        Write-Host "📦 Release packages uploaded to GitHub Releases" -ForegroundColor Cyan
        Write-Host "🎯 All platforms supported: x86, x64, ARM64" -ForegroundColor Cyan
        Write-Host "🛠️  Universal Manager + Platform-specific Agents" -ForegroundColor Cyan
